<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoolshop StockUp</title>
<style>
:root{--bg:#f3f4f5;--card:#fff;--tx:#1b2024;--mu:#5f6872;--bd:#d9dde1;--ac:#0e6b5c;--acbg:#dff0ec;--dg:#b3261e;--on:#fff;--ach:#0a5649;--wb:#fdf0d3;--wt:#7a5200;--db:#fbe3e1;--dt:#b3261e;--gb:#d8f1df;--gt:#14632f;--bs:#b4bbc2;--mm:#8a929a}
@media(prefers-color-scheme:dark){:root{--bg:#16191b;--card:#1f2326;--tx:#e9ecee;--mu:#9aa3ab;--bd:#343a3f;--ac:#5fc4b0;--acbg:#1d3a35;--dg:#f2958f;--on:#0b1512;--ach:#86d9c8;--wb:#3d3216;--wt:#f0c96a;--db:#4a2220;--dt:#f2958f;--gb:#1b3a28;--gt:#8fdcab;--bs:#555e66;--mm:#7b858e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:22px;margin:0 0 12px}h2{font-size:20px;margin:0}h3{font-size:16px;margin:16px 0 8px}
.mu{color:var(--mu);font-size:13px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin:0 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);padding:9px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.ghost{background:none}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
.box button{width:100%;margin-top:6px}
.er{color:var(--dg);min-height:1.2em;margin:0 0 6px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.sess{font-size:12px;color:var(--mu);white-space:nowrap}
.wrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;max-width:1000px;margin:0 auto;padding:14px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{text-align:left;border-color:transparent;background:none}
nav button.on{background:var(--acbg);color:var(--ac);font-weight:600}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g8{gap:8px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:8px}
.tg{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chips button{border-radius:16px;padding:5px 12px;font-size:14px}
.chips button.on{background:var(--acbg);color:var(--ac);border-color:transparent}
.chips .rt{margin-left:auto}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;padding:4px 10px;border-radius:8px;border:1px solid var(--bd);user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;right:0;top:100%;margin-top:4px;min-width:170px;z-index:10;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;display:flex;flex-direction:column}
.menu>div button{text-align:left;border:none;background:none}
.menu>div button.dg{color:var(--dg)}
dialog{max-height:90vh;overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:18px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.ld{pointer-events:none}
.ld::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.vt{border-radius:10px;padding:8px 10px;background:var(--bg)}
.vt b{display:block;font-size:18px;line-height:1.25;margin-top:2px}
.vt .mu{color:inherit;opacity:.8}
.vt.g{background:var(--gb);color:var(--gt)}
.vt.y{background:var(--wb);color:var(--wt)}
.vt.d{background:var(--db);color:var(--dt)}
.pr{font-size:18px;font-weight:600;white-space:nowrap}
.menu summary.pri{padding:9px 14px;border-color:var(--ac)}
.menu summary.pri:hover{background:var(--ach);border-color:var(--ach)}
dialog.wide{width:min(94vw,560px)}
.lb{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.lb select,.lb input{margin-bottom:8px}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.pc{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:8px}
.pc-head{display:flex;align-items:center;gap:14px}
.pc-photo{width:64px;height:64px;border-radius:8px;border:.5px solid var(--bd);flex:none;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mm);overflow:hidden}
.pc-photo[data-a]{cursor:pointer}
.pc-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pc-photo svg{width:24px;height:24px}
.pc-main{flex:1;min-width:0}
.pc-name{font-size:16px;font-weight:500;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-meta{font-size:12px;font-weight:400;color:var(--mu);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-price{font-size:16px;font-weight:500;white-space:nowrap}
.pc .menu summary{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center}
.pc .menu summary svg{width:18px;height:18px}
.qty{display:inline-flex;align-items:baseline;justify-content:center;gap:3px;box-sizing:border-box;min-width:56px;padding:3px 10px;border:1px solid var(--bs);border-radius:8px;font-size:18px;font-weight:500;color:var(--tx);white-space:nowrap;background:transparent}
.qty small{font-size:13px;font-weight:400;color:var(--mu)}
.bdg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 10px;border-radius:8px;white-space:nowrap}
.bdg svg{width:16px;height:16px;flex:none}
.bdg.ok{background:var(--gb);color:var(--gt)}
.bdg.low{background:var(--wb);color:var(--wt)}
.bdg.no{background:var(--db);color:var(--dt)}
.stock-row{display:grid;grid-template-columns:auto auto;grid-template-areas:"q p" "q b";column-gap:14px;row-gap:6px;align-items:center}
.stock-row .pc-price{grid-area:p;justify-self:end}
.stock-row .qty{grid-area:q}
.stock-row .bdg{grid-area:b;justify-self:end}
.pc-vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--bd)}
.pc-var{border:.5px solid var(--bd);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pc-vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;align-self:stretch}
.vl{font-size:12px;color:var(--mu);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl b{font-size:14px;font-weight:500;color:var(--tx)}
@media(max-width:640px){
.pc{padding:10px 12px}
.pc-head{gap:10px}
.pc-photo{width:44px;height:44px}
.pc-photo svg{width:20px;height:20px}
.pc-name,.pc-price{font-size:15px;line-height:1.3}
.pc .menu summary{width:28px;height:28px;border:0}
.pc.single .pc-head{flex-wrap:wrap}
.pc.single .menu{order:2}
.pc.single .stock-row{order:3;flex:0 0 100%;grid-template-columns:minmax(0,1fr) 60px 120px;grid-template-areas:none;column-gap:8px;margin-top:8px;padding-top:8px;border-top:.5px solid var(--bd)}
.pc.single .stock-row>*{grid-area:auto;justify-self:auto}
.qty{width:60px;min-width:0;padding:2px 6px;font-size:16px}
.qty small{font-size:12px}
.qty.qs{font-size:13px}
.bdg{width:120px;justify-content:center;box-sizing:border-box;font-size:12px;padding:4px 6px;border-radius:6px;gap:4px}
.bdg svg{width:14px;height:14px}
.pc-vars{display:block;border-top:0;padding-top:0;margin-top:8px}
.pc-var{display:grid;grid-template-columns:minmax(0,1fr) 60px 120px;column-gap:8px;align-items:center;border:0;border-top:.5px solid var(--bd);border-radius:0;padding:7px 0}
.pc-vrow{display:contents}
}
.tg.y{background:var(--wb);color:var(--wt)}
.tg.d{background:var(--db);color:var(--dt)}
.vs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.er:empty{display:none}
label.mu{display:block;margin:0 0 3px}
dialog label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
dialog h3{margin-top:0}
dialog .rw{justify-content:flex-end;margin-top:8px}
dialog .rw.dh{justify-content:space-between;margin-top:0;margin-bottom:8px}
dialog .rw.dh h3{margin:0}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,8px);transition:opacity .2s,transform .2s;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;max-width:90vw;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
main.fx{animation:up .25s ease both}
.auth .box{animation:up .3s ease both}
button{transition:background-color .15s,transform .1s,opacity .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:wait}
button:active{background:var(--acbg)}
.pri:active{background:var(--ach)}
@media(hover:hover){
button:not(:disabled):hover{background:var(--acbg);border-color:var(--ac)}
.pri:not(:disabled):hover{background:var(--ach);border-color:var(--ach)}
.menu summary:hover{background:var(--acbg);border-color:var(--ac)}
.cd:hover{border-color:var(--ac)}
}
.menu[open]>div{animation:pop .15s ease both;transform-origin:top right}
dialog[open]{animation:pop .18s ease both}
dialog[open]::backdrop{animation:fade .18s ease both}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
@media(max-width:799px){
.wrap{display:block;padding:12px 12px 80px}
nav{position:fixed;left:0;right:0;bottom:0;flex-direction:row;background:var(--card);border-top:1px solid var(--bd);padding:6px;z-index:5}
nav button{flex:1;text-align:center;padding:9px 2px;font-size:13px}
}
/* красные кнопки удаления, желтая кнопка изменения, подсветка незаполненных полей */
button.dg{color:var(--dg);border-color:var(--dg)}
.dgb{background:var(--dg);color:var(--on);border-color:var(--dg)}
.warn{background:var(--wb);color:var(--wt);border-color:var(--wt)}
.bad{border-color:var(--dg)!important;box-shadow:0 0 0 1px var(--dg)}
@media(hover:hover){
.dg:not(:disabled):hover{background:var(--db);border-color:var(--dg)}
.dgb:not(:disabled):hover{background:var(--dg);border-color:var(--dg);opacity:.9}
.warn:not(:disabled):hover{background:var(--wb);border-color:var(--wt);filter:brightness(.96)}
}
/* накладная */
.sug{border:1px solid var(--bd);border-radius:8px;margin:-4px 0 10px;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;border:0;border-bottom:.5px solid var(--bd);border-radius:0;background:none}
.sug button:last-child{border-bottom:0}
.sug .mu{margin-left:8px}
.ln{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:7px 10px;margin-bottom:6px}
.ln-main{flex:1;min-width:0}
.ln-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:18px;height:18px}
.tot{font-weight:600;font-size:16px;margin:10px 0 0}
.vrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.vrow input{margin:0;flex:1;min-width:0}
.vrow input:disabled{opacity:.55}
.vrow button{flex:none}
.doc{padding:9px 12px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
// Ссылка на скрипт Google (заканчивается на /exec). Вставьте сюда, чтобы не вводить на каждом устройстве.
var NEED = 5; // ожидаемая версия скрипта
var API = 'https://script.google.com/macros/s/AKfycbwE5xQhOrGGYkof2SA7BufObJC0nRHg-J0U4bDqtjQac9cbzXzKdLZlEmQKjJTu7GmF/exec';

var S = {tk: localStorage.getItem('tk') || '', me: null, first: false, view: '', err: '', page: 'home', sellers: [], dict: [], dt: 'category', ld: {}, fx: 0, products: [], docs: [], df: 'receipt', q: '', tab: 'act', sort: localStorage.getItem('sort') || 'name'};
var DT = {category: 'Категории', material: 'Материалы', vartype: 'Типы вариаций', supplier: 'Поставщики', source: 'Источники заказов',
  payment: 'Способы оплаты', delivery: 'Способы доставки', discount_reason: 'Причины скидок',
  writeoff_reason: 'Причины списания', return_reason: 'Причины возврата'};
var NAV = [['home', 'Главная'], ['products', 'Склад'], ['docs', 'Документы'], ['sellers', 'Продавцы'], ['settings', 'Справочники']];

function url() { return API || localStorage.getItem('api') || ''; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.className = 'show';
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { t.className = ''; }, 3200);
}

async function call(a, d) {
  var el = S.btn; S.btn = null;
  if (el) el.classList.add('ld');
  try { return await call0(a, d); }
  finally { if (el) el.classList.remove('ld'); }
}
async function call0(a, d) {
  var r, j;
  try {
    r = await fetch(url(), {method: 'POST', body: JSON.stringify({action: a, token: S.tk, data: d || {}})});
  } catch (e) { throw new Error('Нет связи со скриптом. Проверьте ссылку и интернет.'); }
  try { j = await r.json(); } catch (e) { throw new Error('Скрипт ответил неожиданно. Проверьте, что он опубликован для всех.'); }
  if (j.auth === false) { S.tk = ''; S.me = null; localStorage.removeItem('tk'); }
  if (!j.ok) throw new Error(j.error || 'Ошибка');
  return j;
}

async function init() {
  if (!url()) { S.view = 'setup'; return render(); }
  try {
    var j;
    if (S.tk) { try { j = await call('me'); S.me = j.me; } catch (e) { S.me = null; } }
    if (!S.me) { j = await call('status'); S.first = !j.hasSellers; }
    if (!j || j.ver !== NEED) {
      var sv = j && j.ver ? j.ver : 'нет номера (старый скрипт)';
      throw new Error(j && j.ver > NEED
        ? 'Страница устарела: скрипт версии ' + sv + ', а страница ждет версию ' + NEED + '. Загрузите свежий index.html на хостинг и откройте страницу с Ctrl+F5.'
        : 'Скрипт устарел: страница ждет версию ' + NEED + ', а скрипт отвечает: ' + sv + '. В Apps Script вставьте новый Code.gs и создайте НОВУЮ версию развертывания (Развернуть → Управление развертываниями → карандаш → Версия: Новая версия → Развернуть).');
    }
    S.view = S.me ? 'app' : 'login';
  } catch (e) { S.view = 'err'; S.err = e.message; }
  render();
  if (S.me) load();
}

async function load() {
  try {
    if (S.page === 'sellers') { S.sellers = (await call('sellers.list')).items; S.ld.sellers = 1; }
    if (S.page === 'settings') { S.dict = (await call('dict.list')).items; S.ld.dict = 1; }
    if (S.page === 'products') {
      var pj = await call('products.list'); S.products = pj.items; S.dict = pj.dict; S.ld.products = 1; S.ld.dict = 1;
    }
    if (S.page === 'docs') {
      var dj = await call('docs.list'); S.docs = dj.items; S.products = dj.products; S.dict = dj.dict;
      S.ld.docs = 1; S.ld.products = 1; S.ld.dict = 1;
    }
  } catch (e) { toast(e.message); if (!S.me) return init(); }
  render();
}

function box(title, body) { return '<div class="auth"><div class="box"><h1>' + title + '</h1>' + body + '</div></div>'; }

// items: [действие, подпись, класс (необязательно, например 'dg' для красной кнопки)]
function menu(items, id, icon) {
  return '<details class="menu"><summary aria-label="Опции">' + (icon || '⋯') + '</summary><div>' + items.map(function (i) {
    return '<button' + (i[2] ? ' class="' + i[2] + '"' : '') + ' data-a="' + i[0] + '" data-id="' + esc(id) + '">' + i[1] + '</button>';
  }).join('') + '</div></details>';
}

function page() {
  if (S.page === 'products') return S.ld.products ? productsPage() : '<h2>Склад</h2><p class="mu">Загрузка…</p>';
  if (S.page === 'docs') return S.ld.docs ? docsPage() : '<h2>Документы</h2><p class="mu">Загрузка…</p>';
  if (S.page === 'sellers' && !S.ld.sellers) return '<h2>Продавцы</h2><p class="mu">Загрузка…</p>';
  if (S.page === 'settings' && !S.ld.dict) return '<h2>Справочники</h2><p class="mu">Загрузка…</p>';
  if (S.page === 'sellers') {
    return '<div class="rw"><h2>Продавцы</h2><button class="pri" data-a="addSeller">Добавить</button></div>' +
      S.sellers.map(function (s) {
        return '<div class="cd rw"><div><b>' + esc(s.name) + '</b><div class="mu">' + esc(s.login) + '</div></div><div class="rw g8">' +
          (s.active ? '' : '<span class="tg">Отключен</span>') +
          menu([['renSeller', 'Переименовать'], ['pwSeller', 'Сменить пароль'], ['togSeller', s.active ? 'Отключить' : 'Включить']], s.id) +
          '</div></div>';
      }).join('');
  }
  if (S.page === 'settings') {
    var chips = Object.keys(DT).map(function (k) {
      return '<button class="' + (S.dt === k ? 'on' : '') + '" data-a="dt" data-k="' + k + '">' + DT[k] + '</button>';
    }).join('');
    var items = S.dict.filter(function (x) { return x.type === S.dt; });
    var act = items.filter(function (x) { return !x.archived; });
    var arc = items.filter(function (x) { return x.archived; });
    return '<h2>Справочники</h2><div class="chips">' + chips + '</div>' +
      '<div class="rw"><h3>' + DT[S.dt] + '</h3><button class="pri" data-a="addDict">Добавить</button></div>' +
      (act.length ? act.map(function (x) {
        return '<div class="cd rw"><span>' + esc(x.name) + '</span>' + menu([['renDict', 'Переименовать'], ['arcDict', 'В архив']], x.id) + '</div>';
      }).join('') : '<p class="mu">Здесь пока пусто. Нажмите «Добавить».</p>') +
      (arc.length ? '<h3>Архив</h3>' + arc.map(function (x) {
        return '<div class="cd rw"><span class="mu">' + esc(x.name) + '</span><div class="rw g8"><button class="ghost" data-a="resDict" data-id="' + esc(x.id) + '">Восстановить</button>' +
          '<button class="ghost dg" data-a="delDict" data-id="' + esc(x.id) + '">Удалить</button></div></div>';
      }).join('') : '');
  }
  return '<h2>Главная</h2><div class="cd"><p style="margin:0">Основа готова: вход, продавцы и справочники. Товары, склад и заказы появятся на следующих этапах.</p></div>';
}

var D = null;
var DOC = {receipt: 'Поступление', writeoff: 'Списание', adjust: 'Корректировка'};
function avail(v) { return v.stock - v.reserve; }
function vcls(v, p) { var a = avail(v); return a <= 0 ? 'd' : a <= p.min ? 'y' : 'g'; }
function prod(id) { return S.products.filter(function (p) { return p.id === id; })[0]; }
function dn(t, cur) {
  var a = S.dict.filter(function (x) { return x.type === t && !x.archived; }).map(function (x) { return x.name; });
  if (cur && a.indexOf(cur) < 0) a.unshift(cur);
  return a;
}
function opts(a, sel) {

function shrink(file, cb) {
  var img = new Image(), u = URL.createObjectURL(file);
  img.onload = function () {
    var k = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    var q = 0.8, s = c.toDataURL('image/jpeg', q);
    while (s.length > 40000 && q > 0.3) { q -= 0.1; s = c.toDataURL('image/jpeg', q); }
    cb(s.length > 45000 ? null : s);
  };
  img.onerror = function () { URL.revokeObjectURL(u); cb(null); };
  img.src = u;
}

  if (edit) {
    var fi = d.querySelector('#pfile'), ph = d.querySelector('#pph');
    d.querySelector('[data-pick]').onclick = function () { fi.click(); };
    d.querySelector('[data-nop]').onclick = function () { photo = ''; ph.innerHTML = ico('photo'); };
    fi.onchange = function () {
      var file = fi.files && fi.files[0];
      if (!file) return;
      shrink(file, function (s) {
        if (!s) { er.textContent = 'Не удалось обработать фото. Выберите другой файл.'; return; }
        er.textContent = ''; photo = s; ph.innerHTML = '<img src="' + s + '" alt="">';
      });
      fi.value = '';
    };
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var g = function (n) { return f.elements[n] ? f.elements[n].value.trim() : ''; };
    var req = ['pname', 'pcat', 'pmat', 'pprice'];
    if (vt && g('pvt')) req.push('pvals');
    var bad = req.filter(function (n) { return g(n) === ''; });
    if (bad.length) {
      bad.forEach(function (n) { f.elements[n].classList.add('bad'); });
      f.elements[bad[0]].focus(); er.textContent = 'Заполните выделенные поля'; return;
    }
    var data = {name: g('pname'), sku: g('psku'), category: g('pcat'), material: g('pmat'), price: g('pprice')};
    if (edit) data.id = p.id; else data.min = g('pmin');
    if (edit && photo !== undefined) data.photo = photo;
    if (vt) { data.vartype = g('pvt'); data.values = g('pvals'); }
    var btn = f.querySelector('.pri'); btn.disabled = true; S.btn = btn;
    call('products.save', data).then(function (j) { d.close(); done(j); })
      .catch(function (err) { btn.disabled = false; er.textContent = err.message; });
  });
  d.addEventListener('close', function () { d.remove(); });
  document.body.appendChild(d); d.showModal();
  var first = d.querySelector('input'); if (first) first.focus();
}

function varsForm(p) {
  var vs = p.vars.filter(function (v) { return v.value !== 'Без вариации'; });
  var cur = (vs[0] || {}).vartype || '';
  var d = document.createElement('dialog');
  d.innerHTML = '<form method="dialog" novalidate><h3>Вариации: ' + esc(p.name) + '</h3>' +
    '<label>Тип вариации</label><select name="vt"><option value="">Не выбрано</option>' + opts(dn('vartype', cur).map(function (x) { return [x, x]; }), cur) + '</select>' +
    '<label>Текущие вариации</label>' + vs.map(function (v) {
      return '<div class="vrow" data-id="' + esc(v.id) + '" data-st="' + v.stock + '" data-arc="' + (v.archived ? 1 : 0) + '"><input value="' + esc(v.value) + '"' +
        (v.archived ? ' disabled' : '') + ' autocomplete="off"><button type="button" class="ghost" data-t>' + (v.archived ? 'Вернуть' : 'В архив') + '</button></div>';
    }).join('') +
    '<label>Добавить значения</label><input name="vv" placeholder="Например: 20, 21" autocomplete="off">' +
    '<p class="er"></p><div class="rw"><button type="button" class="ghost" data-c>Отмена</button><button type="submit" class="pri">Сохранить</button></div></form>';
  var f = d.querySelector('form'), er = d.querySelector('.er');
  d.querySelector('[data-c]').onclick = function () { d.close(); };
  f.addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]');
    if (!b) return;
    var row = b.parentNode, arc = row.dataset.arc === '1';
    if (!arc && Number(row.dataset.st) > 0) {
      er.textContent = 'Нельзя архивировать вариацию с остатком (' + row.dataset.st + ' шт.). Сначала спишите остаток.'; return;
    }
    er.textContent = '';
    row.dataset.arc = arc ? '0' : '1';
    row.querySelector('input').disabled = !arc;
    b.textContent = arc ? 'В архив' : 'Вернуть';
  });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var items = Array.prototype.map.call(f.querySelectorAll('.vrow'), function (r) {
      return {id: r.dataset.id, value: r.querySelector('input').value.trim(), archived: r.dataset.arc === '1'};
    });
    var btn = f.querySelector('.pri'); btn.disabled = true; S.btn = btn;
    call('vars.update', {productId: p.id, vartype: f.elements.vt.value, items: items, values: f.elements.vv.value})
      .then(function (j) { d.close(); productsDone(j); })
      .catch(function (err) { btn.disabled = false; er.textContent = err.message; });
  });
  d.addEventListener('close', function () { d.remove(); });
  document.body.appendChild(d); d.showModal();
}

function confirmDel(text, cb) {
  var d = document.createElement('dialog');
  d.innerHTML = '<h3>Удалить навсегда?</h3><p style="margin:0 0 10px">' + text + '</p><p class="er"></p>' +
    '<div class="rw"><button type="button" class="ghost" data-c>Отмена</button><button type="button" class="dgb" data-ok>Удалить навсегда</button></div>';
  d.querySelector('[data-c]').onclick = function () { d.close(); };
  d.querySelector('[data-ok]').onclick = function () {
    var b = this; b.disabled = true; S.btn = b;
    cb().then(function () { d.close(); }).catch(function (e) { b.disabled = false; d.querySelector('.er').textContent = e.message; });
  };
  d.addEventListener('close', function () { d.remove(); });
  document.body.appendChild(d); d.showModal();
}

function render() {
  var h;
  if (S.view === 'setup') {
    h = box('Подключение', '<p class="mu">Вставьте ссылку на скрипт (она заканчивается на /exec).</p><input id="api" placeholder="https://script.google.com/macros/s/…/exec"><button class="pri" data-a="saveApi">Сохранить</button>');
  } else if (S.view === 'err') {
    h = box('Не удалось подключиться', '<p>' + esc(S.err) + '</p><button class="pri" data-a="retry">Повторить</button><button class="ghost" data-a="resetApi">Изменить ссылку</button><p class="mu" style="margin:12px 0 0"><a href="' + esc(url()) + '?check=1" target="_blank" rel="noopener">Проверить скрипт (откроется в новой вкладке)</a></p>');
  } else if (S.view === 'login') {
    h = box(S.first ? 'Первый запуск' : 'Вход',
      (S.first ? '<p class="mu">Создайте первого продавца. Он сможет добавить остальных.</p><input id="nm" placeholder="Имя">' : '') +
      '<input id="lg" placeholder="Логин" autocapitalize="none" autocomplete="username"><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><p class="er" id="er"></p>' +
      '<button class="pri" data-a="login">' + (S.first ? 'Создать и войти' : 'Войти') + '</button>');
  } else if (S.view === 'app' && S.me) {
    h = '<div class="top"><b>Hoolshop StockUp</b><div class="rw g8"><span class="sess">Текущий сеанс:</span><details class="menu"><summary>' + esc(S.me.name) + ' ▾</summary><div><button data-a="myPw">Сменить пароль</button><button class="dg" data-a="logout">Выйти</button></div></details></div></div>' +
      '<div class="wrap"><nav>' + NAV.map(function (n) {
        return '<button class="' + (S.page === n[0] ? 'on' : '') + '" data-a="nav" data-p="' + n[0] + '">' + n[1] + '</button>';
      }).join('') + '</nav><main' + (S.fx ? ' class="fx"' : '') + '>' + page() + '</main></div>';
  } else { h = ''; }
  document.getElementById('app').innerHTML = h;
  S.fx = 0;
}

function ask(title, fields, okLabel, cb) {
  var d = document.createElement('dialog');
  d.innerHTML = '<form method="dialog"><h3>' + esc(title) + '</h3>' + fields.map(function (f, i) {
    return '<label>' + esc(f.l) + '</label>' + (f.o
      ? '<select name="f' + i + '"><option value="">Не выбрано</option>' + opts(f.o.map(function (x) { return [x, x]; }), f.v) + '</select>'
      : '<input name="f' + i + '" type="' + (f.t || 'text') + '"' + (f.t === 'number' ? ' step="any" inputmode="decimal"' : '') + ' value="' + esc(f.v == null ? '' : f.v) + '"' + (f.p ? ' placeholder="' + esc(f.p) + '"' : '') + ' autocomplete="off">');
  }).join('') + '<p class="er"></p><div class="rw"><button type="button" class="ghost" data-c>Отмена</button><button type="submit" class="pri">' + esc(okLabel) + '</button></div></form>';
  var f = d.querySelector('form');
  d.querySelector('[data-c]').onclick = function () { d.close(); };
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var vals = fields.map(function (_, i) { return f.elements['f' + i].value; });
    var btn = f.querySelector('.pri'); btn.disabled = true; S.btn = btn;
    cb(vals).then(function () { d.close(); }).catch(function (err) {
      btn.disabled = false; d.querySelector('.er').textContent = err.message;
    });
  });
  d.addEventListener('close', function () { d.remove(); });
  document.body.appendChild(d);
  d.showModal();
  var first = d.querySelector('input'); if (first) first.focus();
}

function seller(id) { return S.sellers.filter(function (s) { return s.id === id; })[0]; }
function ditem(id) { return S.dict.filter(function (s) { return s.id === id; })[0]; }
function dictDone(j) { S.dict = j.items; render(); }
function productsDone(j) { S.products = j.items; S.dict = j.dict; render(); }
function sellersDone(j) { S.sellers = j.items; render(); }

var A = {
  saveApi: function () {
    var v = document.getElementById('api').value.trim();
    if (!/^https:\/\/.+/.test(v)) return toast('Нужна ссылка, которая начинается с https://');
    localStorage.setItem('api', v); init();
  },
  retry: function () { init(); },
  resetApi: function () { localStorage.removeItem('api'); S.view = 'setup'; render(); },
  login: function () {
    var g = function (i) { var e = document.getElementById(i); return e ? e.value.trim() : ''; };
    var d = {login: g('lg'), password: document.getElementById('pw').value, name: g('nm')};
    var lb = document.querySelector('.pri[data-a="login"]'); lb.disabled = true;
    call(S.first ? 'firstSeller' : 'login', d).then(function (j) {
      S.tk = j.token; localStorage.setItem('tk', j.token); S.me = j.me; S.view = 'app'; S.page = 'home'; render();
    }).catch(function (e) { lb.disabled = false; document.getElementById('er').textContent = e.message; });
  },
  logout: function () {
    call('logout').catch(function () {}).then(function () {
      S.tk = ''; S.me = null; localStorage.removeItem('tk'); init();
    });
  },
  nav: function (d) { S.page = d.p; S.fx = 1; render(); load(); },
  myPw: function () {
    ask('Сменить пароль', [{l: 'Новый пароль', t: 'password'}], 'Сохранить', function (v) {
      return call('sellers.password', {id: S.me.id, password: v[0]}).then(function () { toast('Пароль изменен'); });
    });
  },
  addSeller: function () {
    ask('Новый продавец', [{l: 'Имя'}, {l: 'Логин'}, {l: 'Пароль', t: 'password'}], 'Добавить', function (v) {
      return call('sellers.add', {name: v[0], login: v[1], password: v[2]}).then(sellersDone);
    });
  },
  renSeller: function (d) {
    var s = seller(d.id);
    ask('Имя продавца', [{l: 'Имя', v: s.name}], 'Сохранить', function (v) {
      return call('sellers.update', {id: s.id, name: v[0]}).then(sellersDone);
    });
  },
  pwSeller: function (d) {
    var s = seller(d.id);
    ask('Пароль: ' + s.name, [{l: 'Новый пароль', t: 'password'}], 'Сохранить', function (v) {
      return call('sellers.password', {id: s.id, password: v[0]}).then(function () { toast('Пароль изменен'); });
    });
  },
  togSeller: function (d) {
    var s = seller(d.id);
    call('sellers.update', {id: s.id, active: !s.active}).then(sellersDone).catch(function (e) { toast(e.message); });
  },
  tab: function (d) { S.tab = d.v; render(); },
  newP: function () { prodForm(null, productsDone); },
  editP: function (d) { var p = prod(d.id); if (p) prodForm(p, productsDone); },
  minP: function (d) {
    var p = prod(d.id);
    ask('Минимальный остаток: ' + p.name, [{l: 'Минимальный остаток (пусто, чтобы убрать)', t: 'number', v: p.min, p: 'Введите число'}], 'Сохранить', function (v) {
      return call('products.min', {id: p.id, min: v[0]}).then(productsDone);
    });
  },
  varsP: function (d) { var p = prod(d.id); if (p) varsForm(p); },
  arcP: function (d) { call('products.archive', {id: d.id}).then(productsDone).catch(function (e) { toast(e.message); }); },
  resP: function (d) { call('products.restore', {id: d.id}).then(productsDone).catch(function (e) { toast(e.message); }); },
  delP: function (d) {
    var p = prod(d.id);
    confirmDel('Товар «' + esc(p.name) + '» будет удален вместе с вариациями и остатками. История документов сохранится. Это действие нельзя отменить.', function () {
      return call('products.delete', {id: p.id}).then(productsDone);
    });
  },
  df: function (d) { S.df = d.k; render(); },
  newDoc: function (d) {
    document.querySelectorAll('details.menu[open]').forEach(function (m) { m.open = false; });
    if (d.t !== 'receipt' && !S.products.some(function (p) { return !p.archived; })) return toast('Сначала добавьте товар в разделе «Склад»');
    D = {type: d.t, lines: [], sup: '', rs: '', cm: '', q: '', pid: '', vid: '', qty: '', price: ''};
    var el = document.createElement('dialog');
    el.id = 'ddlg'; el.className = 'wide'; el.innerHTML = docBody();
    el.addEventListener('close', function () { el.remove(); D = null; });
    document.body.appendChild(el); el.showModal(); dTot();
  },
  dPick: function (d) {
    var p = prod(d.id);
    if (!p) return;
    D.pid = p.id; D.q = p.name; D.vid = ''; D.qty = '';
    D.price = (D.type === 'receipt' && p.cost) ? String(p.cost) : '';
    dfix(); dRedraw();
    var el = dlg().querySelector(needVar(p) ? '[data-p="vid"]' : '[data-p="qty"]');
    if (el) el.focus();
  },
  dNewP: function () {
    var old = S.products.map(function (p) { return p.id; });
    prodForm(null, function (j) {
      S.products = j.items; S.dict = j.dict;
      var np = j.items.filter(function (p) { return old.indexOf(p.id) < 0; })[0];
      if (np) { D.pid = np.id; D.q = np.name; D.vid = ''; D.price = ''; dfix(); }
      dRedraw();
    }, D.q);
  },
  dEditP: function () {
    var p = prod(D.pid);
    if (!p) return;
    prodForm(p, function (j) {
      S.products = j.items; S.dict = j.dict;
      var np = prod(D.pid);
      if (np) D.q = np.name;
      dfix(); dRedraw();
    });
  },
  dAddLine: function () {
    var T = D.type, rc = T === 'receipt', p = prod(D.pid), bad = [], er = document.getElementById('dper'), qn = Number(D.qty);
    if (!p) bad.push('q'); else if (needVar(p) && !D.vid) bad.push('vid');
    if (D.qty === '' || !isFinite(qn) || qn < 0 || Math.floor(qn) !== qn || (T !== 'adjust' && qn === 0)) bad.push('qty');
    if (rc && (D.price === '' || !(Number(D.price) >= 0))) bad.push('price');
    if (bad.length) {
      bad.forEach(function (k) { var el = dlg().querySelector('[data-p="' + k + '"]'); if (el) el.classList.add('bad'); });
      er.textContent = !p ? 'Выберите товар из списка подсказок' : 'Заполните выделенные поля';
      return;
    }
    if (D.lines.some(function (l) { return l.vid === D.vid; })) { er.textContent = 'Эта позиция уже в списке: измените ее карандашом'; return; }
    D.lines.push({pid: D.pid, vid: D.vid, qty: D.qty, price: D.price});
    D.q = ''; D.pid = ''; D.vid = ''; D.qty = ''; D.price = '';
    dRedraw();
  },
  dEditLine: function (d) { lineDlg(+d.i); },
  dClose: function () { dlg().close(); },
  dSave: function () {
    var T = D.type, er = document.getElementById('der'), bad = [];
    er.textContent = '';
    if (T === 'receipt' && !D.sup) bad.push('sup');
    if (T === 'writeoff' && !D.rs) bad.push('rs');
    if (T === 'adjust' && !D.cm.trim()) bad.push('cm');
    if (bad.length) {
      bad.forEach(function (k) { var el = dlg().querySelector('[data-h="' + k + '"]'); if (el) el.classList.add('bad'); });
      er.textContent = 'Заполните выделенные поля'; return;
    }
    if (D.pid && D.qty !== '') { er.textContent = 'Товар выбран, но не добавлен в список. Нажмите «Добавить в список».'; return; }
    if (!D.lines.length) { er.textContent = 'Добавьте хотя бы одну позицию в список'; return; }
    call('docs.save', {type: T, supplier: D.sup, reason: D.rs, comment: D.cm,
      lines: D.lines.map(function (l) { return {varId: l.vid, qty: l.qty, price: l.price}; })}).then(function (j) {
      S.docs = j.items; S.products = j.products; S.dict = j.dict; S.df = T; dlg().close(); toast('Документ проведен'); render();
    }).catch(function (e) { er.textContent = e.message; });
  },
  openDoc: function (d) {
    var doc = S.docs.filter(function (x) { return x.id === d.id; })[0];
    call('docs.get', {id: d.id}).then(function (j) {
      view(DOC[doc.type] + ' №' + doc.num,
        '<p class="mu">' + fdt(doc.created) + ' · ' + esc(doc.seller) + (doc.supplier ? ' · Поставщик: ' + esc(doc.supplier) : '') +
        (doc.type === 'writeoff' && doc.reason ? ' · Причина: ' + esc(doc.reason) : '') + (doc.comment ? ' · ' + esc(doc.comment) : '') + '</p>' +
        j.lines.map(function (l) {
          return '<div class="lb"><b>' + esc(l.label) + '</b><div class="mu">' + (l.qty > 0 && doc.type !== 'receipt' ? '+' : '') + l.qty +
            ' шт × ' + money(l.cost) + ' = ' + money(l.sum) + '</div></div>';
        }).join('') + '<p><b>Итого: ' + money(doc.total) + '</b></p>');
    }).catch(function (e) { toast(e.message); });
  },
  dt: function (d) { S.dt = d.k; render(); },
  addDict: function () {
    ask('Добавить: ' + DT[S.dt], [{l: 'Название'}], 'Добавить', function (v) {
      return call('dict.add', {type: S.dt, name: v[0]}).then(dictDone);
    });
  },
  renDict: function (d) {
    var x = ditem(d.id);
    ask('Переименовать', [{l: 'Название', v: x.name}], 'Сохранить', function (v) {
      return call('dict.rename', {id: x.id, name: v[0]}).then(dictDone);
    });
  },
  arcDict: function (d) { call('dict.archive', {id: d.id}).then(dictDone).catch(function (e) { toast(e.message); }); },
  resDict: function (d) { call('dict.restore', {id: d.id}).then(dictDone).catch(function (e) { toast(e.message); }); },
  delDict: function (d) {
    var x = ditem(d.id);
    confirmDel('Запись «' + esc(x.name) + '» будет удалена. Это действие нельзя отменить.', function () {
      return call('dict.delete', {id: x.id}).then(dictDone);
    });
  }
};

document.addEventListener('click', function (e) {
  document.querySelectorAll('details.menu[open]').forEach(function (m) { if (!m.contains(e.target)) m.open = false; });
  var b = e.target.closest('[data-a]');
  if (b && A[b.dataset.a]) {
    var mm = b.closest('details.menu');
    if (mm) mm.open = false;
    S.btn = b; A[b.dataset.a](b.dataset);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && /^(pw|lg|nm|api)$/.test(e.target.id)) {
    var b = document.querySelector('.pri[data-a]'); if (b) b.click();
  }
});

document.addEventListener('change', function (e) {
  if (e.target.id !== 'srt') return;
  S.sort = e.target.value; localStorage.setItem('sort', S.sort);
  document.getElementById('plist').innerHTML = plist();
});
document.addEventListener('input', dSync);
document.addEventListener('change', dSync);
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; document.getElementById('plist').innerHTML = plist(); }
});

init();
</script>
