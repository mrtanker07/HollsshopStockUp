*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:22px;margin:0 0 12px}h2{font-size:20px;margin:0}h3{font-size:16px;margin:16px 0 8px}
.mu{color:var(--mu);font-size:13px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin:0 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);padding:9px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.ghost{background:none}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
.box button{width:100%;margin-top:6px}
.er{color:var(--dg);min-height:1.2em;margin:0 0 6px;font-size:14px}
.er:empty{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.sess{font-size:12px;color:var(--mu);white-space:nowrap}
.wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:16px 20px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{text-align:left;border-color:transparent;background:none}
nav button.on{background:var(--acbg);color:var(--ac);font-weight:600}
nav .mb,.more{display:none}
.ni{display:none}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g8{gap:8px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:8px}
.tg{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chips button{border-radius:16px;padding:5px 12px;font-size:14px}
.chips button.on{background:var(--acbg);color:var(--ac);border-color:transparent}
.chips .rt{margin-left:auto}
.cats{margin-top:6px}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;padding:4px 10px;border-radius:8px;border:1px solid var(--bd);user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;right:0;top:100%;margin-top:4px;min-width:170px;z-index:10;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;display:flex;flex-direction:column}
.menu>div button{text-align:left;border:none;background:none}
.menu>div button.dg{color:var(--dg)}
dialog{max-height:92vh;overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:18px;width:min(92vw,380px)}
dialog:focus{outline:none}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog.md{width:min(94vw,700px)}
dialog.wide{width:min(94vw,600px)}
dialog.xl{width:min(96vw,1180px)}
.ld{pointer-events:none}
.ld::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#gl{position:fixed;top:60px;right:16px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:5px 12px 5px 10px;font-size:13px;color:var(--mu);box-shadow:0 4px 14px rgba(0,0,0,.14)}
#gl i{width:14px;height:14px;border:2px solid var(--ac);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.menu summary.pri{padding:9px 14px;border-color:var(--ac)}
.menu summary.pri:hover{background:var(--ach);border-color:var(--ach)}
.lb{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.lb select,.lb input{margin-bottom:8px}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.pc{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:8px}
.pc-head{display:flex;align-items:center;gap:14px}
.pc-photo{width:64px;height:64px;border-radius:8px;border:.5px solid var(--bd);flex:none;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mm);overflow:hidden}
.pc-photo[data-a]{cursor:pointer}
.pc-photo img{width:100%;height:100%;object-fit:cover;display:block}

.pc-main{flex:1;min-width:0}
.pc-name{font-size:16px;font-weight:500;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pc-price{font-size:16px;font-weight:500;white-space:nowrap}
.pc-price.mu{font-size:13px;font-weight:400;white-space:normal}
.pc .menu summary{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center}
.pc .menu summary svg{width:18px;height:18px}
.qty{display:inline-flex;align-items:baseline;justify-content:center;gap:3px;box-sizing:border-box;min-width:56px;padding:3px 10px;border:1px solid var(--bs);border-radius:8px;font-size:18px;font-weight:500;color:var(--tx);white-space:nowrap;background:transparent}
.qty small{font-size:13px;font-weight:400;color:var(--mu)}
.bdg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 10px;border-radius:8px;white-space:nowrap}
.bdg svg{width:16px;height:16px;flex:none}
.bdg.ok{background:var(--gb);color:var(--gt)}
.bdg.low{background:var(--wb);color:var(--wt)}
.bdg.no{background:var(--db);color:var(--dt)}
.sg{display:contents}
.pc-vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--bd)}
.pc-var{border:.5px solid var(--bd);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pc-vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;align-self:stretch}
.vl{font-size:12px;color:var(--mu);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl b{font-size:14px;font-weight:500;color:var(--tx)}
.tg.y{background:var(--wb);color:var(--wt)}
.tg.d{background:var(--db);color:var(--dt)}
label.mu{display:block;margin:0 0 3px}
dialog label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
dialog h3{margin-top:0}
dialog .rw{justify-content:flex-end;margin-top:8px}
dialog .rw.dh{justify-content:space-between;margin-top:0;margin-bottom:10px;align-items:flex-start}
dialog .rw.dh h3{margin:0}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,8px);transition:opacity .2s,transform .2s;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;max-width:90vw;z-index:70}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
main.fx{animation:up .25s ease both}
.auth .box{animation:up .3s ease both}
button{transition:background-color .15s,transform .1s,opacity .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:wait}
button:active{background:var(--acbg)}
.pri:active{background:var(--ach)}
@media(hover:hover){
button:not(:disabled):hover{background:var(--acbg);border-color:var(--ac)}
.pri:not(:disabled):hover{background:var(--ach);border-color:var(--ach)}
.menu summary:hover{background:var(--acbg);border-color:var(--ac)}
.cd:hover{border-color:var(--ac)}
}
.menu[open]>div{animation:pop .15s ease both;transform-origin:top right}
dialog[open]{animation:pop .18s ease both}
dialog[open]::backdrop{animation:fade .18s ease both}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
/* красные кнопки, зеленая кнопка, желтая кнопка, подсветка полей */
button.dg{color:var(--dg);border-color:var(--dg)}
button.dg:disabled{cursor:default}
.dgb{background:var(--dg);color:var(--on);border-color:var(--dg)}
.okb{background:var(--gb);color:var(--gt);border-color:var(--gt)}
.warn{background:var(--wb);color:var(--wt);border-color:var(--wt)}
.bad{border-color:var(--dg)!important;box-shadow:0 0 0 1px var(--dg)}

.dg:not(:disabled):hover{background:var(--db);border-color:var(--dg)}

.okb:not(:disabled):hover{background:var(--gb);border-color:var(--gt);filter:brightness(.96)}
.warn:not(:disabled):hover{background:var(--wb);border-color:var(--wt);filter:brightness(.96)}
}
.ic{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}

.fg{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}

.hd{max-width:440px}

.ln{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:7px 10px;margin-bottom:6px}
.ln-main{flex:1;min-width:0}

.ln-n{flex:0 0 100px;text-align:right;white-space:nowrap}
.ln-n.s{flex-basis:130px;font-weight:600}
.tot{font-weight:600;font-size:16px;margin:10px 0 0;text-align:right}

.dr{display:grid;grid-template-columns:150px minmax(0,1.3fr) 130px minmax(0,1fr) minmax(0,1.6fr) 60px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-top:8px;padding:6px 6px 6px 0}

/* ===== версия 8 ===== */
:root{--ib:#dbe9fb;--it:#14478f;--pb:#ebe0fa;--pt:#5b2a99}

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ib:#1c2f4a;--it:#8fbcf2;--pb:#35244f;--pt:#cdb0f2}}
.bdg.bl{background:var(--ib);color:var(--it)}
.bdg.pu{background:var(--pb);color:var(--pt)}
textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin:0 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);resize:vertical;box-sizing:border-box}
textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[readonly]{background:var(--bg);color:var(--mu);cursor:default}
.bdg.nw{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.wt{background:var(--wb);color:var(--wt);border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.menu>div button.on{background:var(--acbg);color:var(--ac);font-weight:600}
.menu.st summary,.menu.st summary:hover{border:0;padding:0;background:none}
.menu.st summary span{cursor:pointer}
.oc .bdg{font-size:15px;padding:7px 14px;border-radius:9px}
.oc .bdg svg{width:18px;height:18px}
button.lk{border:0;background:none;padding:0;text-align:left;color:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:15px}
button.lk:not(:disabled):hover,button.lk:active{background:none;border-color:transparent;text-decoration:underline}
/* клиенты: сегменты */
.cr{display:grid;grid-template-columns:90px minmax(0,1.6fr) 110px 160px minmax(0,1.2fr) 200px 46px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-top:8px;padding:8px 6px 8px 0}

.cr .cn{font-weight:600;color:var(--mu)}
.cr .cm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

async function load() {
  var pg = S.page, L = LOADS[pg];
  if (!L) return;
  var have = !!S.ld[L[1]];
  if (have && Date.now() - (S.ts[pg] || 0) < 30000) return;
  try {
    var j = await call(L[0], L[3] ? L[3]() : null, have, !have), sg = JSON.stringify(j);
    S.ts[pg] = Date.now();
    delete S.lerr[pg];

    S.sig[pg] = sg; L[2](j); S.ld[L[1]] = 1;
  } catch (e) {
    if (!S.me) { toast(e.message); return init(); }

}

// окно клиента: остается открытым, пока идет сохранение
// телефон: всегда +380 и 9 цифр; «+380» стереть нельзя
function phRest(v) {
  var d = String(v || '').replace(/\D/g, '');
  if (d.indexOf('380') === 0) d = d.slice(3);
  else if ('380'.indexOf(d) === 0) d = '';
  else if (d.charAt(0) === '0') d = d.slice(1);
  return d.slice(0, 9);
}
function phFmt(r) {
  var f = '+38 (0' + r.slice(0, 2);
  if (r.length > 2) f += ') ' + r.slice(2, 5);
  if (r.length > 5) f += '-' + r.slice(5, 7);
  if (r.length > 7) f += '-' + r.slice(7, 9);
  return f;
}
var PHL = 6; // длина неудаляемой части «+38 (0»
function clientForm(c, done) {
  var d = document.createElement('dialog'), saving = false;
  d.className = 'cf';
  var v = function (k) { return esc(c && c[k] ? c[k] : ''); };
  d.innerHTML = '<form method="dialog" novalidate><h3>' + (c ? 'Редактировать клиента' : 'Новый клиент') + '</h3>' +
    '<div class="cg"><div><label>Фамилия *</label><input name="ln" placeholder="Введите фамилию" autocomplete="off" value="' + v('lastName') + '"></div>' +
    '<div><label>Имя *</label><input name="fn" placeholder="Введите имя" autocomplete="off" value="' + esc(c ? (c.firstName || c.name) : '') + '"></div>' +
    '<div><label>Отчество</label><input name="mn" placeholder="Необязательно" autocomplete="off" value="' + v('middleName') + '"></div></div>' +
    '<div class="cg2"><div><label>Телефон *</label><input name="ph" type="tel" inputmode="tel" autocomplete="off" style="margin-bottom:4px" value="' + phFmt(phRest(c && c.phone)) + '"><p class="mu phc" data-phc style="margin:0 0 10px"></p></div>' +
    '<div><label>Ссылка на соцсеть</label><input name="ct" placeholder="Например: https://instagram.com/nick" autocomplete="off" value="' + v('contact') + '"></div></div>' +
    '<label>Адрес доставки</label><input name="ad" placeholder="Город, отделение или адрес" autocomplete="off" value="' + v('address') + '">' +
    '<label>Заметка</label><textarea name="nt" rows="3" placeholder="Введите заметку">' + v('note') + '</textarea>' +
    '<p class="er"></p><div class="rw"><button type="button" class="ghost" data-c>Отмена</button><button type="submit" class="pri">' + (c ? 'Сохранить' : 'Создать') + '</button></div></form>';
  var f = d.querySelector('form'), er = d.querySelector('.er'), sb = f.querySelector('.pri'), cb = f.querySelector('[data-c]');
  cb.onclick = function () { d.close(); };
  d.addEventListener('cancel', function (e) { if (saving) e.preventDefault(); });
  f.addEventListener('input', function (e) { e.target.classList.remove('bad'); });
  var ph = f.elements.ph, phc = f.querySelector('[data-phc]');
  var phSync = function () {
    var act = document.activeElement === ph, cnt = ph.value.slice(0, ph.selectionStart).replace(/\D/g, '').length;
    var r = phRest(ph.value), nv = phFmt(r);
    if (ph.value !== nv) {
      ph.value = nv;
      if (act) {
        var want = Math.max(3, cnt), i = 0, seen = 0;
        if (want >= 3 + r.length) i = nv.length;
        else while (i < nv.length && seen < want) { if (/\d/.test(nv.charAt(i))) seen++; i++; }
        i = Math.max(PHL, i);
        try { ph.setSelectionRange(i, i); } catch (x) {}
      }
    }
    phc.textContent = r.length === 9 ? 'Номер введен полностью' : 'Введено цифр: ' + r.length + ' из 9';
    phc.style.color = r.length === 9 ? 'var(--gt)' : '';
  };
  ph.addEventListener('input', phSync);
  ph.addEventListener('focus', function () { setTimeout(function () { if (ph.selectionStart < PHL) ph.setSelectionRange(ph.value.length, ph.value.length); }, 0); });
  ph.addEventListener('keydown', function (e) {
    var b = ph.selectionEnd;
    if ((e.key === 'Backspace' || e.key === 'Delete') && b <= PHL) e.preventDefault();
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && b <= PHL) ph.setSelectionRange(ph.value.length, ph.value.length);

      return;

    saving = true; er.textContent = ''; sb.disabled = true; cb.disabled = true; S.btn = sb;

  openD(d);
}

var O = null;
function oFree(v) { return v.stock - v.reserve; }
// сколько этой вариации уже стоит в редактируемом заказе (она уже в резерве) и сколько добавлено в список сейчас
function oOwn(vid) {
  var o = O.id ? ord(O.id) : null;
  return o ? o.lines.filter(function (l) { return l.varId === vid; }).reduce(function (a, l) { return a + l.qty; }, 0) : 0;
}
function oInList(vid, skip) {
  return O.lines.reduce(function (a, l, i) { return a + (l.vid === vid && i !== skip ? Number(l.qty) || 0 : 0); }, 0);
}
function oAvail(v, skip) { return oFree(v) + oOwn(v.id) - oInList(v.id, skip); }
function oVarObj(vid) {
  var r = null;
  S.products.some(function (p) { return p.vars.some(function (v) { if (v.id === vid) { r = v; return true; } return false; }); });
  return r;
}
function oPct() {
  var cl = client(O.cid);
  if (!cl || O.autoOff) return 0;
  if (O.autoPct !== '') { var n = Number(String(O.autoPct).replace(',', '.')); return isFinite(n) ? Math.min(100, Math.max(0, n)) : 0; }
  return cl.pct;
}
function todayStr() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
// скидки считаются тем же кодом, что и на сервере (autoDisc): сервер все равно пересчитывает при сохранении
function oEng() {
  var cl = client(O.cid), ex = O.id ? ord(O.id) : null;
  var own = !!(ex && (ex.promos || []).some(function (p) { return p.key === 'review'; }));
  var lines = O.lines.map(function (l) {
    var p = prod(l.pid);
    return {qty: Number(l.qty) || 0, price: p ? p.price : 0, category: p ? p.category : '', sku: p ? p.sku : ''};
  });
  return autoDisc({lines: lines, pct: oPct(), reviewOk: !!(cl && (cl.reviewOk || (own && cl.review))), reviewAmt: S.reviewAmt || 0,
    promos: S.promos || [], off: O.off || [], today: todayStr()});
}
function oCalc() {
  var e = oEng(), dA = 0, dP = 0, dM = 0, sub = e.sub;
  e.items.forEach(function (i) { if (i.applied) { if (i.key === 'loyal') dA += i.amount; else dP += i.amount; } });
  dA = Math.min(dA, sub); dP = Math.min(dP, Math.max(0, sub - dA));
  if (O.man && Number(O.man.value) > 0) dM = O.man.kind === 'pct' ? Math.round(sub * Number(O.man.value)) / 100 : Number(O.man.value);
  dM = Math.min(dM, Math.max(0, sub - dA - dP));
  return {sub: sub, dA: dA, dP: dP, dM: dM, total: sub - dA - dP - dM, items: e.items};
}
// адрес клиента подставляется сам, пока вы не поменяли его вручную
// адрес доставки: почта = город/село + номер отделения; «Курьер» = один адрес. Хранится одной строкой, поэтому сервер менять не нужно.
function oMail() { return /почт|пошт/i.test(O.del || ''); }
function oAddrStr() {
  if (!oMail()) return O.keep || '';
  if (O.cour) return O.addr.trim() ? 'Курьер, ' + O.addr.trim() : 'Курьер';
  return [O.city.trim(), O.br ? '№' + O.br : ''].filter(Boolean).join(', ');

function oAddrSet(str) {
  var t = String(str || '').trim(), m;
  O.city = ''; O.br = ''; O.cour = false; O.addr = ''; O.keep = '';
  if (!t) return;
  if ((m = t.match(/^Курьер(?:,\s*(.*))?$/i))) { O.cour = true; O.addr = m[1] || ''; return; }
  if ((m = t.match(/^(.*?),?\s*№\s*(\d+)$/))) { O.city = m[1].trim(); O.br = m[2]; return; }
  O.city = t; O.keep = t;
}

  };
  if (!cl.address) { S.btn = null; save().catch(function (e) { toast(e.message); }); return; }

// Автоматические скидки: постоянный клиент, скидка за отзыв, акции. Один и тот же код в Code.gs и в index.html.
function autoDisc(x) {
  var r2 = function (v) { return Math.round(v * 100) / 100; }, sub = 0, items = [];
  x.lines.forEach(function (l) { sub += l.qty * l.price; });
  if (x.pct > 0 && sub > 0) items.push({ key: 'loyal', type: 'loyal', name: 'Постоянный клиент −' + x.pct + '%', amount: r2(sub * x.pct / 100) });
  if (x.reviewOk && x.reviewAmt > 0 && sub > 0) items.push({ key: 'review', type: 'review', name: 'Скидка за отзыв', amount: r2(Math.min(x.reviewAmt, sub)) });
  (x.promos || []).forEach(function (p) {
    if ((p.dateFrom && x.today < p.dateFrom) || (p.dateTo && x.today > p.dateTo)) return;
    var cat = String(p.category || '').toLowerCase();
    var skus = String(p.skus || '').toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var qq = 0, qs = 0;
    x.lines.forEach(function (l) {
      var hit = (!cat && !skus.length) || (cat && String(l.category || '').toLowerCase() === cat) || (skus.length && skus.indexOf(String(l.sku || '').toLowerCase()) >= 0);
      if (hit) { qq += l.qty; qs += l.qty * l.price; }
    });
    if (qs <= 0 || qq < (Number(p.minQty) || 1)) return;
    items.push({ key: 'promo:' + p.id, type: 'promo', name: 'Акция «' + p.name + '»', stack: !!p.stack,
                 amount: r2(p.kind === 'sum' ? Math.min(p.value, qs) : qs * p.value / 100) });
  });
  var off = x.off || [], best = null;
  items.forEach(function (it) {
    it.applied = true; it.note = '';
    if (off.indexOf(it.key) >= 0) { it.applied = false; it.off = true; it.note = 'снята'; }
  });
  items.forEach(function (it) { if (it.type === 'promo' && it.applied && (!best || it.amount > best.amount)) best = it; });
  items.forEach(function (it) { if (it.type === 'promo' && it.applied && it !== best) { it.applied = false; it.note = 'применена более выгодная акция'; } });
  if (best && !best.stack) {
    var others = items.filter(function (it) { return it.type !== 'promo' && it.applied; }), os = 0;
    others.forEach(function (it) { os += it.amount; });
    if (others.length) {
      if (best.amount >= os) others.forEach(function (it) { it.applied = false; it.note = 'не совмещается с акцией'; });
      else { best.applied = false; best.note = 'не совмещается с другими скидками'; }
    }
  }
  var auto = 0;
  items.forEach(function (it) { if (it.applied) auto += it.amount; });
  return { sub: r2(sub), items: items, auto: r2(Math.min(auto, sub)) };
}

  if (k === 'products') {

    return {cols: [['Товар', T], ['Категория', T], ['Продано, шт', N], ['Выручка', M], ['Себестоимость', M], ['Прибыль', M], ['Доля выручки', 'p'], ['Вариации', T]],

  return Math.min.apply(null, vs.map(function (v) { return {no: 0, low: 1, ok: 2}[status(v.stock, p.min)[0]]; }));
}
function sortItems(items) {
  var s = S.sort, nm = function (a, b) { return String(a.name).localeCompare(String(b.name), 'ru'); };
  return items.slice().sort(function (a, b) {
    if (s === 'name') return nm(a, b);
    if (s === 'name-d') return nm(b, a);
    if (s === 'new') return S.products.indexOf(b) - S.products.indexOf(a); // строки в таблице идут по порядку создания
    var d = prank(a) - prank(b);
    if (s === 'st-d') d = -d;
    return d || nm(a, b);
  });
}

function cardHtml(p) {
  var vs = p.vars.filter(function (v) { return !v.archived; });
  var single = !vs.length || (vs.length === 1 && vs[0].value === 'Без вариации');
  var meta = [p.category, p.material, p.sku ? '#' + p.sku : ''].filter(Boolean).join(' · ');
  var mn = p.archived
    ? [['resP', 'Восстановить'], ['delP', 'Удалить навсегда', 'dg']]
    : [['editP', 'Редактировать'], ['minP', 'Изменить минимальный остаток']].concat(single ? [] : [['varsP', 'Изменить вариации']], [['arcP', 'В архив']]);
  var photo = '<div class="pc-photo"' + (p.archived && !p.photo ? '' : ' role="button" tabindex="0" aria-label="' + (p.photo ? 'Увеличить фото' : 'Добавить фото') + '" data-a="' + (p.photo ? 'zoomP' : 'addPhoto') + '" data-id="' + esc(p.id) + '"') + '>' +
    (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : ico('photo')) + '</div>';
  var head = photo + '<div class="pc-main"><p class="pc-name" title="' + esc(p.name) + '">' + esc(p.name) + '</p>' +
    (meta ? '<p class="pc-meta">' + esc(meta) + '</p>' : '') + '</div>';
  var m = menu(mn, p.id, ico('dots')), price = priceHtml(p), sg = function (c, x) { return '<div class="sg ' + c + '">' + x + '</div>'; };
  if (single) {
    var q = vs.length ? vs[0].stock : 0;
    return '<div class="pc single"><div class="pc-head">' + head + '<div class="stock-row">' + sg('sp', price) + sg('sq', qtyBox(q)) + sg('ss', badge(q, p.min)) + '</div>' + sg('so', m) + '</div></div>';
  }
  var tot = vs.reduce(function (a, v) { return a + v.stock; }, 0);
  var nl = vs.filter(function (v) { return status(v.stock, p.min)[0] !== 'ok'; }).length;
  var ag = tot === 0 ? ['no', 'circle-x', 'Нет в наличии']
    : vs.some(function (v) { return status(v.stock, p.min)[0] !== 'ok'; }) ? ['low', 'alert-triangle', 'Заканчивается'] : ['ok', 'circle-check', 'В наличии'];
  return '<div class="pc"><div class="pc-head">' + head + sg('sp', price) + sg('sq sa', qtyBox(tot)) +
    sg('ss sa', '<span class="bdg ' + ag[0] + '" title="Итог по всем вариациям">' + ico(ag[1]) + ag[2] + (ag[0] === 'low' ? ' · ' + nl + ' поз.' : '') + '</span>') + sg('so', m) + '</div><div class="pc-vars">' + vs.map(function (v) {
    return '<div class="pc-var"><div class="pc-vrow"><span class="vl">' + vlabel(v) + '</span>' + qtyBox(v.stock) + '</div>' + badge(v.stock, p.min) + '</div>';
  }).join('') + '</div></div>';
}

function plist() {
  var q = S.q.trim().toLowerCase();
  var items = S.products.filter(function (p) {
    if (!!p.archived !== (S.tab === 'arc')) return false;
    if (S.cat && p.category !== S.cat) return false;
    if (S.tab === 'no' || S.tab === 'low') {
      var want = S.tab;
      if (!p.vars.some(function (v) { return !v.archived && status(v.stock, p.min)[0] === want; })) return false;
    }
    return !q || (p.name + ' ' + p.sku).toLowerCase().indexOf(q) >= 0;
  });
  if (!items.length) return '<p class="mu">' + (S.products.length ? 'Ничего не найдено.' : 'Товаров пока нет. Нажмите «Новый товар».') + '</p>';
  return sortItems(items).map(cardHtml).join('');
}

var SORTS = [['name', 'По названию: А → Я'], ['name-d', 'По названию: Я → А'], ['new', 'Сначала новые товары'], ['st', 'По статусу: сначала нет в наличии'], ['st-d', 'По статусу: сначала в наличии']];
function filtOn() { return S.sort !== 'name' || S.tab === 'no' || S.tab === 'low' || !!S.cat; }
function syncReset() { document.querySelectorAll('[data-a="resetF"]').forEach(function (b) { b.disabled = !filtOn(); }); }
var STATS = [['all', 'Все'], ['no', 'Нет в наличии'], ['low', 'Заканчивается']];

function catNames() {
  var list = dn('category');

}
// на телефоне под кнопкой «Фильтр»: что выбрано и «Сбросить»
function filtSummary() {

function productsPage() {

function docsPage() {

function docHtml(doc, lines) {

function docLines(id, silent) {

// ---------- создание документа ----------

function activeVars(p) { return p.vars.filter(function (v) { return !v.archived; }); }
function needVar(p) { var a = activeVars(p); return !(a.length === 1 && a[0].value === 'Без вариации'); }

function lineLabel(l) {
  var p = prod(l.pid), v = p && p.vars.filter(function (x) { return x.id === l.vid; })[0];
  return p ? p.name + (v && v.value !== 'Без вариации' ? ', ' + vname(v) : '') : 'Товар удален';
}
// Открыть окно без перехода фокуса на первое поле ввода
function openD(d) { d.tabIndex = -1; document.body.appendChild(d); d.showModal(); d.focus(); }
function dlg() { return document.getElementById('ddlg'); }
function dfix() {
  var p = prod(D.pid);

  var a = activeVars(p);
  if (!needVar(p)) D.vid = a[0] ? a[0].id : '';
  else if (!a.some(function (v) { return v.id === D.vid; })) D.vid = '';
}
function pbtn() {

}
function sugHtml() {
  var q = D.q.trim(), pr = D.type === 'pricing';
  if (!q || (!pr && D.pid)) return '';
  var m = S.products.filter(function (p) {
    return !p.archived && pmatch(p, q) && (!pr || !D.plines.some(function (l) { return l.pid === p.id; }));
  }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'ru'); }).slice(0, 10);
  if (!m.length) return '<div class="sug"><p class="mu" style="margin:0;padding:10px 12px">Ничего не найдено.' + (D.type === 'receipt' ? ' Товар можно создать кнопкой сверху.' : '') + '</p></div>';
  return '<div class="sug">' + m.map(function (p) {

function varHtml() {

}
function linesHtml() {
  var rc = D.type === 'receipt', ad = D.type === 'adjust';

      '<button type="button" class="ghost ic" data-a="dEditLine" data-i="' + i + '" aria-label="Изменить позицию">' + ico('edit') + '</button></div>';
  }).join('');
}

function rcHtml() {
  if (!D.rcOpen) return '';
  var rs = S.docs.filter(function (x) { return x.type === 'receipt'; }).slice(0, 10);
  if (!rs.length) return '<div class="sug"><p class="mu" style="margin:0;padding:10px 12px">Поступлений пока нет.</p></div>';

function dTot() {
  var e = document.getElementById('dtot'); if (!e) return;
  e.textContent = 'Итоговая сумма: ' + money(D.lines.reduce(function (a, l) { return a + (Number(l.qty) || 0) * (Number(l.price) || 0); }, 0));

function dRedraw() {

function dCur() {

function dSync(e) {
  var t = e.target;
  if (!D || !dlg() || !t.dataset || !dlg().contains(t)) return;
  t.classList.remove('bad');
  if (t.dataset.pl !== undefined) { D.plines[+t.dataset.pl].price = t.value; return; }
  if (t.dataset.h) { D[t.dataset.h] = t.value; return; }
  var k = t.dataset.p;
  if (!k || D[k] === t.value) return;
  D[k] = t.value;
  if (k === 'q') {
    if (D.pid) { D.pid = ''; D.vid = ''; }
    dCur();
  }
}
function docDlg() {

}
function view(title, html) {

}

// Окно изменения одной позиции накладной
function lineDlg(i) {

function shrink(file, cb) {
  var img = new Image(), u = URL.createObjectURL(file);
  img.onload = function () {
    var k = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    var q = 0.8, s = c.toDataURL('image/jpeg', q);
    while (s.length > 40000 && q > 0.3) { q -= 0.1; s = c.toDataURL('image/jpeg', q); }
    cb(s.length > 45000 ? null : s);
  };
  img.onerror = function () { URL.revokeObjectURL(u); cb(null); };
  img.src = u;
}

      autoPct: O.autoPct, offKeys: O.off, manual: O.man ? {kind: O.man.kind, value: O.man.value, reason: O.man.reason} : null,
      lines: O.lines.map(function (l) { return {varId: l.vid, qty: l.qty}; })}).then(function (j) {
      mine.saving = false;
      var el = document.getElementById('odlg'); if (el) el.close();
      ordDone(j); toast('Заказ сохранен');
      askAddr(sCid, sAddr, sPrev);
    }).catch(function (e) { mine.saving = false; var x = document.getElementById('oer'); if (x) x.textContent = e.message; });
  },
  oOff: function (d) {
    var i = O.off.indexOf(d.k);
    if (i >= 0) O.off.splice(i, 1); else O.off.push(d.k);
    oRedraw();
  },
  pArc: function () { S.pa = S.pa ? 0 : 1; render(); },
  newPromo: function () { promoForm(null); },
  editPromo: function (d) { var p = S.promoAll.filter(function (x) { return x.id === d.id; })[0]; if (p) promoForm(p); },
  togPromo: function (d) { call('promos.toggle', {id: d.id}).then(pDone).catch(function (e) { toast(e.message); }); },
  arcPromo: function (d) { call('promos.archive', {id: d.id}).then(pDone).catch(function (e) { toast(e.message); }); },
  resPromo: function (d) { call('promos.restore', {id: d.id}).then(pDone).catch(function (e) { toast(e.message); }); },
  delPromo: function (d) {
    var p = S.promoAll.filter(function (x) { return x.id === d.id; })[0]; if (!p) return;
    confirmDel('Акция «' + esc(p.name) + '» будет удалена навсегда. Это действие нельзя отменить.', function () {
      return call('promos.delete', {id: p.id}).then(pDone);
    });
  },
  revAsk: function (d) {
    var c = client(d.id); if (!c) return;
    S.btn = null;
    var on = !c.review;
    yesNo(on ? 'Отзыв оставлен?' : 'Снять отметку об отзыве?',
      on ? 'Клиент «' + esc(c.name) + '» оставил отзыв в сторис?' : 'У клиента «' + esc(c.name) + '» отметка об отзыве будет снята.', function () {
      return call('clients.review', {id: c.id, value: on}).then(function (j) { S.clients = j.items; S.reviewAmt = j.reviewAmt; render(); toast(on ? 'Отзыв отмечен' : 'Отметка об отзыве снята'); });
    });
  },
  payOrd: function (d) {
    var o = ord(d.id); if (!o) return;
    var on = !o.payOk;
    var go = function () {
      return call('orders.pay', {id: o.id, value: on}).then(function (j) { o.payOk = j.payOk; ordRepaint(); toast(j.payOk ? 'Заказ отмечен как оплаченный' : 'Отметка об оплате снята'); });
    };
    if (on) confirmAct('Подтвердить оплату?', 'Заказ №' + o.num + ': ' + esc(o.payment) + ', ' + money(o.total) + '. Отмечайте заказ оплаченным только после того, как деньги поступили. Подтверждаете оплату?', 'Да, оплачено', 'ok', go);
    else confirmAct('Снять отметку об оплате?', 'Заказ №' + o.num + ' снова будет считаться неоплаченным.', 'Снять отметку', 'dg', go);
  },
  retOrd: function (d) { var o = ord(d.id); if (o) retDlg(o); },
  rpre: function (d) {
    if (d.k === 'range') { S.rp.k = 'range'; render(); return; }
    rpSet(d.k); S.ld.reports = 0; S.ts.reports = 0; render(); load();
  },
  rpGo: function () {
    var f = document.getElementById('rpf').value, t = document.getElementById('rpt').value;
    if (!f || !t) return toast('Укажите обе даты');
    if (t < f) return toast('Дата окончания раньше даты начала');
    S.rp = {k: 'range', from: f, to: t}; S.ld.reports = 0; S.ts.reports = 0; render(); load();
  },
  rtab: function (d) { S.rv = d.k; render(); },
  rsort: function (d) { S.rt = d.k; render(); },
  csv: function () {
    var t = repTable(S.rv); if (!t || !t.rows.length) return;
    var nm = RTABS.filter(function (x) { return x[0] === S.rv; })[0][1];
    csvDownload('Отчет ' + nm + ' ' + S.rp.from + ' — ' + S.rp.to, t.cols.map(function (c) { return c[0]; }), t.rows);
  },
  aArc: function () { S.aa = S.aa ? 0 : 1; render(); },
  newAd: function () { adForm(null); },
  editAd: function (d) { var a = S.ads.filter(function (x) { return x.id === d.id; })[0]; if (a) adForm(a); },
  arcAd: function (d) { call('ads.archive', {id: d.id}).then(aDone).catch(function (e) { toast(e.message); }); },
  resAd: function (d) { call('ads.restore', {id: d.id}).then(aDone).catch(function (e) { toast(e.message); }); },
  delAd: function (d) {
    var a = S.ads.filter(function (x) { return x.id === d.id; })[0]; if (!a) return;
    confirmDel('Запись «' + esc(a.name) + '» будет удалена навсегда. Это действие нельзя отменить.', function () {
      return call('ads.delete', {id: a.id}).then(aDone);
    });
  },
  backupNow: function () {
    call('backup.now').then(function (j) { S.info.backup = j.backup; toast('Копия создана: ' + j.name); render(); }).catch(function (e) { toast(e.message); });
  },
  df: function (d) { S.df = d.k; render(); },
  newDoc: function (d) {
    document.querySelectorAll('details.menu[open]').forEach(function (m) { m.open = false; });
    if (d.t !== 'receipt' && !S.products.some(function (p) { return !p.archived; })) return toast('Сначала добавьте товар в разделе «Склад»');
    D = d.t === 'pricing'
      ? {type: 'pricing', plines: [], cm: '', q: '', rcOpen: false, err: ''}
      : {type: d.t, lines: [], sup: '', rs: '', cm: '', q: '', pid: '', vid: '', qty: '', price: '', err: ''};
    docDlg();
  },
  dPick: function (d) {
    var p = prod(d.id);
    if (!p) return;
    D.pid = p.id; D.q = p.name; D.vid = ''; D.qty = '';
    D.price = (D.type === 'receipt' && p.cost) ? String(p.cost) : '';
    dfix(); dRedraw();
    var el = dlg().querySelector(needVar(p) ? '[data-p="vid"]' : '[data-p="qty"]');
    if (el) el.focus();
  },
  dNewP: function () {
    var old = S.products.map(function (p) { return p.id; });
    prodForm(null, function (j) {
      S.products = j.items; S.dict = j.dict;
      var np = j.items.filter(function (p) { return old.indexOf(p.id) < 0; })[0];
      if (D && np) { D.pid = np.id; D.q = np.name; D.vid = ''; D.price = ''; dfix(); }
      dRedraw();
    }, D.q);
  },
  dEditP: function () {
    var p = prod(D.pid);
    if (!p) return;
    prodForm(p, function (j) {
      S.products = j.items; S.dict = j.dict;
      var np = D && prod(D.pid);
      if (np) D.q = np.name;
      if (D) { dfix(); dRedraw(); }
    });
  },
  dAddLine: function () {
    var T = D.type, rc = T === 'receipt', p = prod(D.pid), bad = [], er = document.getElementById('dper'), qn = Number(D.qty);
    if (!p) bad.push('q'); else if (needVar(p) && !D.vid) bad.push('vid');
    if (D.qty === '' || !isFinite(qn) || qn < 0 || Math.floor(qn) !== qn || (T !== 'adjust' && qn === 0)) bad.push('qty');
    if (rc && (D.price === '' || !(Number(D.price) >= 0))) bad.push('price');
    if (bad.length) {
      bad.forEach(function (k) { var el = dlg().querySelector('[data-p="' + k + '"]'); if (el) el.classList.add('bad'); });
      er.textContent = !p ? 'Выберите товар из списка подсказок' : 'Заполните выделенные поля';
      return;
    }
    if (D.lines.some(function (l) { return l.vid === D.vid; })) { er.textContent = 'Эта позиция уже в списке: измените ее карандашом'; return; }
    D.lines.push({pid: D.pid, vid: D.vid, qty: D.qty, price: D.price});
    D.q = ''; D.pid = ''; D.vid = ''; D.qty = ''; D.price = '';
    dRedraw();
    var q = dlg().querySelector('[data-p="q"]'); if (q) q.focus();
  },
  dEditLine: function (d) { lineDlg(+d.i); },
  // ценообразование
  pRcToggle: function () { D.rcOpen = !D.rcOpen; document.getElementById('prc').innerHTML = rcHtml(); },
  pRc: function (d) {
    var mine = D;
    docLines(d.id).then(function (lines) {
      if (D !== mine || !dlg()) return;
      var added = 0, skipped = 0;
      lines.forEach(function (l) {
        var p = prod(l.productId);
        if (!p || p.archived) { skipped++; return; }
        if (D.plines.some(function (x) { return x.pid === p.id; })) return;
        D.plines.push({pid: p.id, price: p.price > 0 ? String(p.price) : ''}); added++;
      });
      D.rcOpen = false; dRedraw();
      toast('Добавлено товаров: ' + added + (skipped ? '. Пропущено (удалены или в архиве): ' + skipped : ''));
    }).catch(function (e) { toast(e.message); });
  },
  pAdd: function (d) {
    var p = prod(d.id);
    if (!p || D.plines.some(function (x) { return x.pid === p.id; })) return;
    D.plines.push({pid: p.id, price: p.price > 0 ? String(p.price) : ''}); D.q = '';
    dRedraw();
    var el = dlg().querySelector('[data-pl="' + (D.plines.length - 1) + '"]'); if (el) el.focus();
  },
  pDel: function (d) { D.plines.splice(+d.i, 1); dRedraw(); },
  dClose: function () { dlg().close(); },
  dSave: function () {
    if (D.saving) return;
    var T = D.type, er = document.getElementById('der'), bad = [];
    er.textContent = '';
    var payload;
    if (T === 'pricing') {
      if (!D.plines.length) { er.textContent = 'Добавьте хотя бы один товар'; return; }
      D.plines.forEach(function (l, i) { if (l.price.trim() === '' || !(Number(l.price) >= 0)) bad.push(i); });
      if (bad.length) {
        bad.forEach(function (i) { var el = dlg().querySelector('[data-pl="' + i + '"]'); if (el) el.classList.add('bad'); });
        er.textContent = 'Укажите розничную цену у выделенных товаров'; return;
      }
      payload = {type: T, comment: D.cm, lines: D.plines.map(function (l) { return {productId: l.pid, price: l.price}; })};
    } else {
      if (T === 'receipt' && !D.sup) bad.push('sup');
      if (T === 'writeoff' && !D.rs) bad.push('rs');
      if (T === 'adjust' && !D.cm.trim()) bad.push('cm');
      if (bad.length) {
        bad.forEach(function (k) { var el = dlg().querySelector('[data-h="' + k + '"]'); if (el) el.classList.add('bad'); });
        er.textContent = 'Заполните выделенные поля'; return;
      }
      if (D.pid && D.qty !== '') { er.textContent = 'Товар выбран, но не добавлен в список. Нажмите «Добавить».'; return; }
      if (!D.lines.length) { er.textContent = 'Добавьте хотя бы одну позицию в список'; return; }
      payload = {type: T, supplier: D.sup, reason: D.rs, comment: D.cm,
        lines: D.lines.map(function (l) { return {varId: l.vid, qty: l.qty, price: l.price}; })};
    }
    // окно остается открытым, пока идет проведение, и закрывается после ответа; при ошибке документ откроется заново как был
    var snap = D, el = dlg(), sb = S.btn;
    snap.saving = true;
    if (!sb || !el.contains(sb)) sb = el.querySelector('[data-a="dSave"]');
    el.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    S.btn = sb;
    call('docs.save', payload).then(function (j) {
      D = null; el.close();
      keepLines(j.items); S.docs = j.items; S.products = j.products; S.dict = j.dict; S.df = T; toast('Документ проведен'); render();
    }, function (e) {
      el.dataset.keep = '1'; el.close(); el.remove();
      snap.saving = false; snap.err = e.message; D = snap; docDlg();
    });
  },
  openDoc: function (d) {
    var doc = S.docs.filter(function (x) { return x.id === d.id; })[0];
    if (!doc) return;
    S.btn = null;
    var el = view(DOC[doc.type] + ' №' + doc.num, docHtml(doc, S.dl[d.id]));
    el.id = 'dvdlg';
    var rw = el.querySelector('.rw'); rw.style.justifyContent = 'space-between';
    rw.insertAdjacentHTML('afterbegin', '<button class="ghost dg" data-a="delDoc" data-id="' + esc(doc.id) + '">Удалить</button>');
    if (S.dl[d.id]) return;
    docLines(d.id, true).then(function (ls) {
      var vb = el.querySelector('.vb'); if (vb) vb.innerHTML = docHtml(doc, ls);
    }).catch(function (e) { el.close(); toast(e.message); });
  },
  delDoc: function (d) {
    var x = S.docs.filter(function (z) { return z.id === d.id; })[0]; if (!x) return;
    S.btn = null;
    var notes = {receipt: 'Товар из этого поступления будет убран со склада. Если часть уже продана, списана или лежит в резерве заказа, удалить документ не получится.',
      writeoff: 'Списанный товар вернется на склад.',
      adjust: 'Изменения остатков по этой корректировке будут отменены, если товар еще не использован.',
      pricing: 'Цены товаров останутся прежними: исчезнет только запись о документе.'};
    delGate({what: 'документ «' + DOC[x.type] + ' №' + x.num + '»', action: 'docs.delete', id: x.id, note: notes[x.type],
      done: function (j) { var m = document.getElementById('dvdlg'); if (m) m.close(); delete S.dl[x.id]; keepLines(j.items); S.docs = j.items; S.products = j.products; S.dict = j.dict; render(); toast('Документ удален'); }});
  },
  dt: function (d) { S.dt = d.k; render(); },
  addDict: function () {
    ask('Добавить: ' + DT[S.dt], [{l: 'Название'}], 'Добавить', function (v) {
      return call('dict.add', {type: S.dt, name: v[0]}).then(dictDone);
    });
  },
  renDict: function (d) {
    var x = ditem(d.id);
    ask('Переименовать', [{l: 'Название', v: x.name}], 'Сохранить', function (v) {
      return call('dict.rename', {id: x.id, name: v[0]}).then(dictDone);
    });
  },
  refDict: function () {
    call('dict.list').then(function (j) {
      S.dict = j.items; S.dirty = 0; S.ts = {}; S.sig = {};
      toast('Справочники обновлены'); render();
    }).catch(function (e) { toast(e.message); });
  },
  arcDict: function (d) { call('dict.archive', {id: d.id}).then(dictDone).catch(function (e) { toast(e.message); }); },
  resDict: function (d) { call('dict.restore', {id: d.id}).then(dictDone).catch(function (e) { toast(e.message); }); },
  delDict: function (d) {
    var x = ditem(d.id);
    confirmDel('Запись «' + esc(x.name) + '» будет удалена. Это действие нельзя отменить.', function () {
      return call('dict.delete', {id: x.id}).then(dictDone);
    });
  },
  theme: function () {
    S.btn = null;
    var t = themeNow() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (e) {}
    document.querySelectorAll('[data-a="theme"]').forEach(function (b) { b.innerHTML = ico(t === 'dark' ? 'sun' : 'moon'); });
  },
  copyApi: function () { copy(url(), 'Ссылка скопирована'); },
  copyInfo: function () { copy(diag(), 'Диагностика скопирована'); }
};

function closeMore() {
  var m = document.querySelector('.more');
  if (!m) { S.more = false; return render(); }
  m.classList.add('out');
  setTimeout(function () { S.more = false; render(); }, 140);
}
function closeMenus(e) {
  document.querySelectorAll('details.menu[open]').forEach(function (m) { if (!m.contains(e.target)) m.open = false; });
}
document.addEventListener('pointerdown', closeMenus, true);
document.addEventListener('touchstart', closeMenus, {capture: true, passive: true});
document.addEventListener('click', function (e) {
  document.querySelectorAll('details.menu[open]').forEach(function (m) { if (!m.contains(e.target)) m.open = false; });
  if (S.more && !e.target.closest('.more') && !e.target.closest('[data-a="more"]')) closeMore();
  if (D && D.rcOpen && !e.target.closest('.rcbox')) { D.rcOpen = false; var pr = document.getElementById('prc'); if (pr) pr.innerHTML = ''; }
  var b = e.target.closest('[data-a]');
  if (b && A[b.dataset.a]) {
    var mm = b.closest('details.menu');
    if (mm) mm.open = false;
    S.btn = b; A[b.dataset.a](b.dataset);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && /^(pw|lg|nm|api)$/.test(e.target.id)) {
    var b = document.querySelector('.pri[data-a]'); if (b) b.click();
  }
});

document.addEventListener('change', function (e) {
  if (e.target.id !== 'srt' && e.target.id !== 'srt2') return;
  S.sort = e.target.value; localStorage.setItem('sort', S.sort);
  if (e.target.id === 'srt2') { render(); if (S.fd) S.fd.paint(); } else { document.getElementById('plist').innerHTML = plist(); syncReset(); }
});
document.addEventListener('input', dSync);
document.addEventListener('change', dSync);
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; document.getElementById('plist').innerHTML = plist(); }
});

document.addEventListener('input', oSync);
document.addEventListener('change', oSync);
document.addEventListener('input', function (e) {
  if (e.target.id === 'cq') { S.cq = e.target.value; document.getElementById('clist').innerHTML = clist(); }
  if (e.target.id === 'oq') { S.oq = e.target.value; document.getElementById('olist').innerHTML = olist(); }
});

// ТТН: только цифры, счетчик символов, Enter сохраняет
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t.classList || !t.classList.contains('ttn-i')) return;
  var o = ord(t.dataset.ttn), len = o ? oTtnLen(o) : 14, box = t.closest('.ttn');
  var v = t.value.replace(/\D/g, '').slice(0, len);
  if (t.value !== v) t.value = v;
  box.querySelector('.ttn-e').textContent = '';
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && O && e.target.dataset && e.target.dataset.o === 'eq') { e.preventDefault(); S.btn = null; A.oLineOk(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('ttn-i')) {
    e.preventDefault(); S.btn = null; A.ttnSave({id: e.target.dataset.ttn});
  }
});

init();
</script>
