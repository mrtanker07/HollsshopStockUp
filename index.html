<script>
// Ссылка на скрипт Google (заканчивается на /exec). Вставьте сюда, чтобы не вводить на каждом устройстве.
var NEED = 6; // ожидаемая версия скрипта (должна совпадать с VERSION в Code.gs)

var S = {tk: localStorage.getItem('tk') || '', me: null, first: false, view: '', err: '', page: 'home', sellers: [], dict: [], dt: 'category',
  ld: {}, ts: {}, sig: {}, dl: {}, lerr: {}, rec: '', fx: 0, products: [], docs: [], df: 'receipt', q: '', tab: 'all', cat: '', more: false, busy: 0, info: null,
  sort: localStorage.getItem('sort') || 'name'};
var DT = {category: 'Категории', material: 'Материалы', vartype: 'Типы вариаций', supplier: 'Поставщики', source: 'Источники заказов',
  payment: 'Способы оплаты', delivery: 'Способы доставки', discount_reason: 'Причины скидок',
  writeoff_reason: 'Причины списания', return_reason: 'Причины возврата'};
// третий элемент: 1 = на телефоне прячется за кнопку «⋯»
var NAV = [['home', 'Главная'], ['products', 'Склад'], ['docs', 'Документы'], ['settings', 'Справочники', 1], ['sellers', 'Пользователи', 1], ['info', 'Инфо', 1]];

function themeNow() {
  return document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function url() { return API || localStorage.getItem('api') || ''; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.className = 'show';
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { t.className = ''; }, 3200);
}
// индикатор загрузки сверху справа: горит, пока идет хотя бы один запрос
function busy(n) {
  S.busy = Math.max(0, S.busy + n);
  var g = document.getElementById('gl');
  if (g) g.hidden = !S.busy;
}

async function call(a, d, silent) {
  var el = S.btn; S.btn = null;
  if (silent) el = null;
  if (el) el.classList.add('ld');
  if (!silent) busy(1);
  try { return await call0(a, d); }
  finally { if (!silent) busy(-1); if (el) el.classList.remove('ld'); }
}
async function call0(a, d) {
  var r, j;
  try {
    r = await fetch(url(), {method: 'POST', body: JSON.stringify({action: a, token: S.tk, data: d || {}})});
  } catch (e) { throw new Error('Нет связи со скриптом. Проверьте ссылку и интернет.'); }
  try { j = await r.json(); } catch (e) { throw new Error('Скрипт ответил неожиданно. Проверьте, что он опубликован для всех.'); }
  if (j.auth === false) { S.tk = ''; S.me = null; localStorage.removeItem('tk'); }
  if (!j.ok) throw new Error(j.error || 'Ошибка');
  return j;
}

async function init() {
  if (!url()) { S.view = 'setup'; return render(); }
  try {
    var j;
    if (S.tk) { try { j = await call('me'); S.me = j.me; } catch (e) { S.me = null; } }
    if (!S.me) { j = await call('status'); S.first = !j.hasSellers; }
    if (!j || j.ver !== NEED) {
      var sv = j && j.ver ? j.ver : 'нет номера (старый скрипт)';
      throw new Error(j && j.ver > NEED
        ? 'Страница устарела: скрипт версии ' + sv + ', а страница ждет версию ' + NEED + '. Загрузите свежий index.html на хостинг и откройте страницу с Ctrl+F5.'
        : 'Скрипт устарел: страница ждет версию ' + NEED + ', а скрипт отвечает: ' + sv + '. В Apps Script вставьте новый Code.gs и создайте НОВУЮ версию развертывания (Развернуть → Управление развертываниями → карандаш → Версия: Новая версия → Развернуть).');
    }
    S.view = S.me ? 'app' : 'login';
  } catch (e) { S.view = 'err'; S.err = e.message; }
  render();
  if (S.me) load();
}

// страница -> [действие сервера, ключ готовности данных, как применить ответ]
var LOADS = {
  sellers: ['sellers.list', 'sellers', function (j) { S.sellers = j.items; }],
  settings: ['dict.list', 'dict', function (j) { S.dict = j.items; }],
  info: ['info', 'info', function (j) { S.info = j; }],
  products: ['products.list', 'products', function (j) { S.products = j.items; S.dict = j.dict; S.ld.dict = 1; }],
  docs: ['docs.list', 'docs', function (j) { S.docs = j.items; S.products = j.products; S.dict = j.dict; S.ld.products = 1; S.ld.dict = 1; }]
};
// Данные уже есть: показываем сразу, без анимации; обновляем тихо в фоне не чаще раза в 30 секунд.
async function load() {
  var pg = S.page, L = LOADS[pg];
  if (!L) return;
  var have = !!S.ld[L[1]];
  if (have && Date.now() - (S.ts[pg] || 0) < 30000) return;
  try {
    var j = await call(L[0], null, have), sg = JSON.stringify(j);
    S.ts[pg] = Date.now();
    delete S.lerr[pg];
    if (have && S.sig[pg] === sg) return;
    S.sig[pg] = sg; L[2](j); S.ld[L[1]] = 1;
  } catch (e) {
    if (!S.me) { toast(e.message); return init(); }
    if (have) return;
    toast(e.message); S.lerr[pg] = e.message;
  }
  if (S.page === pg) render();
}
function wait(title) {
  var er = S.lerr[S.page];
  return '<h2>' + title + '</h2>' + (er ? '<p class="er">' + esc(er) + '</p><button class="pri" data-a="reload">Повторить</button>' : '<p class="mu">Загрузка…</p>');
}

function box(title, body) { return '<div class="auth"><div class="box"><h1>' + title + '</h1>' + body + '</div></div>'; }

// items: [действие, подпись, класс (необязательно, например 'dg' для красной кнопки)]
function menu(items, id, icon) {
  return '<details class="menu"><summary aria-label="Опции">' + (icon || '⋯') + '</summary><div>' + items.map(function (i) {
    return '<button' + (i[2] ? ' class="' + i[2] + '"' : '') + ' data-a="' + i[0] + '" data-id="' + esc(id) + '">' + i[1] + '</button>';
  }).join('') + '</div></details>';
}

function page() {
  if (S.page === 'products') return S.ld.products ? productsPage() : wait('Склад');
  if (S.page === 'docs') return S.ld.docs ? docsPage() : wait('Документы');
  if (S.page === 'info') return S.ld.info ? infoPage() : wait('Инфо');
  if (S.page === 'sellers' && !S.ld.sellers) return wait('Пользователи');
  if (S.page === 'settings' && !S.ld.dict) return wait('Справочники');
  if (S.page === 'sellers') {
    return '<div class="rw"><h2>Пользователи</h2><button class="pri" data-a="addSeller">Добавить</button></div>' +
      S.sellers.map(function (s) {
        return '<div class="cd rw"><div><b>' + esc(s.name) + '</b><div class="mu">' + esc(s.login) + '</div></div><div class="rw g8">' +
          (s.active ? '' : '<span class="tg">Отключен</span>') +
          menu([['renSeller', 'Переименовать'], ['pwSeller', 'Сменить пароль'], ['togSeller', s.active ? 'Отключить' : 'Включить']], s.id) +
          '</div></div>';
      }).join('');
  }
  if (S.page === 'settings') {
    var chips = Object.keys(DT).map(function (k) {
      return '<button class="' + (S.dt === k ? 'on' : '') + '" data-a="dt" data-k="' + k + '">' + DT[k] + '</button>';
    }).join('');
    var items = S.dict.filter(function (x) { return x.type === S.dt; });
    var act = items.filter(function (x) { return !x.archived; });
    var arc = items.filter(function (x) { return x.archived; });
    return '<h2>Справочники</h2><div class="chips">' + chips + '</div>' +
      '<div class="rw"><h3>' + DT[S.dt] + '</h3><button class="pri" data-a="addDict">Добавить</button></div>' +
      (act.length ? act.map(function (x) {
        return '<div class="cd rw"><span>' + esc(x.name) + '</span>' + menu([['renDict', 'Переименовать'], ['arcDict', 'В архив']], x.id) + '</div>';
      }).join('') : '<p class="mu">Здесь пока пусто. Нажмите «Добавить».</p>') +
      (arc.length ? '<h3>Архив</h3>' + arc.map(function (x) {
        return '<div class="cd rw"><span class="mu">' + esc(x.name) + '</span><div class="rw g8"><button class="ghost" data-a="resDict" data-id="' + esc(x.id) + '">Восстановить</button>' +
          '<button class="ghost dg" data-a="delDict" data-id="' + esc(x.id) + '">Удалить</button></div></div>';
      }).join('') : '');
  }
  return '<h2>Главная</h2><div class="cd"><p style="margin:0">Готовы: вход, пользователи, справочники, склад, поступления, списания, корректировки и ценообразование. Заказы и продажи появятся на следующих этапах.</p></div>';
}

// Поиск: каждое набранное слово должно быть НАЧАЛОМ какого-то слова в названии или артикуле
function words(s) { return String(s == null ? '' : s).toLowerCase().split(/[^0-9a-zа-яёіїєґ]+/i).filter(Boolean); }
function pmatch(p, q) {
  var t = words(q);
  if (!t.length) return false;
  var w = words(p.name + ' ' + p.sku);
  return t.every(function (x) { return w.some(function (y) { return y.indexOf(x) === 0; }); });
}

function ico(n) {

function status(q, min) {
  if (q === 0) return ['no', 'circle-x', 'Нет в наличии'];
  if (min != null && !isNaN(min) && q > 0 && q <= min) return ['low', 'alert-triangle', 'Заканчивается'];
  return ['ok', 'circle-check', 'В наличии'];
}
function badge(q, min) { var s = status(q, min); return '<span class="bdg ' + s[0] + '">' + ico(s[1]) + s[2] + '</span>'; }
function qtyBox(q) { return '<span class="qty' + (q >= 1000 ? ' qs' : '') + '">' + q + ' <small>шт</small></span>'; }
function vlabel(v) {
  return v.value === 'Без вариации' ? '<b>Без вариации</b>' : (v.vartype ? esc(v.vartype) + ' ' : '') + '<b>' + esc(v.value) + '</b>';
}
function priceHtml(p) {
  return p.price > 0 ? '<span class="pc-price">' + money(p.price) + '</span>' : '<span class="pc-price mu">Цена не задана</span>';
}
function prank(p) {
  var vs = p.vars.filter(function (v) { return !v.archived; });
  if (!vs.length) return 0;
  return Math.min.apply(null, vs.map(function (v) { return {no: 0, low: 1, ok: 2}[status(v.stock, p.min)[0]]; }));
}
function sortItems(items) {
  var s = S.sort, nm = function (a, b) { return String(a.name).localeCompare(String(b.name), 'ru'); };
  return items.slice().sort(function (a, b) {
    if (s === 'name') return nm(a, b);
    if (s === 'name-d') return nm(b, a);
    if (s === 'new') { var x = a.lastIn || '', y = b.lastIn || ''; return x < y ? 1 : x > y ? -1 : nm(a, b); }
    var d = prank(a) - prank(b);
    if (s === 'st-d') d = -d;
    return d || nm(a, b);
  });
}

function cardHtml(p) {
  var vs = p.vars.filter(function (v) { return !v.archived; });
  var single = !vs.length || (vs.length === 1 && vs[0].value === 'Без вариации');
  var meta = [p.category, p.material, p.sku ? '#' + p.sku : ''].filter(Boolean).join(' · ');
  var mn = p.archived
    ? [['resP', 'Восстановить'], ['delP', 'Удалить навсегда', 'dg']]
    : [['editP', 'Редактировать'], ['minP', 'Изменить минимальный остаток']].concat(single ? [] : [['varsP', 'Изменить вариации']], [['arcP', 'В архив']]);
  var photo = '<div class="pc-photo"' + (p.archived ? '' : ' role="button" tabindex="0" aria-label="Редактировать товар" data-a="editP" data-id="' + esc(p.id) + '"') + '>' +
    (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : ico('photo')) + '</div>';
  var head = photo + '<div class="pc-main"><p class="pc-name" title="' + esc(p.name) + '">' + esc(p.name) + '</p>' +
    (meta ? '<p class="pc-meta">' + esc(meta) + '</p>' : '') + '</div>';
  var m = menu(mn, p.id, ico('dots')), price = priceHtml(p);
  if (single) {
    var q = vs.length ? vs[0].stock : 0;
    return '<div class="pc single"><div class="pc-head">' + head + '<div class="stock-row">' + price + qtyBox(q) + badge(q, p.min) + '</div>' + m + '</div></div>';
  }
  return '<div class="pc"><div class="pc-head">' + head + price + m + '</div><div class="pc-vars">' + vs.map(function (v) {
    return '<div class="pc-var"><div class="pc-vrow"><span class="vl">' + vlabel(v) + '</span>' + qtyBox(v.stock) + '</div>' + badge(v.stock, p.min) + '</div>';
  }).join('') + '</div></div>';
}

function plist() {
  var q = S.q.trim().toLowerCase();
  var items = S.products.filter(function (p) {
    if (!!p.archived !== (S.tab === 'arc')) return false;
    if (S.cat && p.category !== S.cat) return false;
    if (S.tab === 'no' || S.tab === 'low') {
      var want = S.tab;
      if (!p.vars.some(function (v) { return !v.archived && status(v.stock, p.min)[0] === want; })) return false;
    }
    if (S.rec) {
      var lim = Date.now() - Number(S.rec) * 864e5;
      if (!p.lastIn || new Date(p.lastIn).getTime() < lim) return false;
    }
    return !q || (p.name + ' ' + p.sku).toLowerCase().indexOf(q) >= 0;
  });
  if (!items.length) return '<p class="mu">' + (S.products.length ? 'Ничего не найдено.' : 'Товаров пока нет. Нажмите «Новый товар».') + '</p>';
  return sortItems(items).map(cardHtml).join('');
}

function dSync(e) {

function shrink(file, cb) {
  var img = new Image(), u = URL.createObjectURL(file);
  img.onload = function () {
    var k = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    var q = 0.8, s = c.toDataURL('image/jpeg', q);
    while (s.length > 40000 && q > 0.3) { q -= 0.1; s = c.toDataURL('image/jpeg', q); }
    cb(s.length > 45000 ? null : s);
  };
  img.onerror = function () { URL.revokeObjectURL(u); cb(null); };
  img.src = u;
}

// p == null: создание, иначе редактирование. pre: подставить название. draft: вернуть введенное после ошибки сервера.
function prodForm(p, done, pre, draft) {
  var edit = !!p;
  var hasVars = edit && p.vars.some(function (v) { return !v.archived && v.value !== 'Без вариации'; });
  var photo = draft ? draft.photo : undefined;
  var dv = function (n, def) { return draft && draft.f[n] !== undefined ? draft.f[n] : def; };
  var sel = function (name, label, list, cur) {
    return '<div class="fd"><label>' + label + '</label><select name="' + name + '"><option value="">Не выбрано</option>' +
      opts(list.map(function (x) { return [x, x]; }), dv(name, cur)) + '</select></div>';
  };
  var inp = function (name, label, ph, val, extra, cls) {
    return '<div class="fd' + (cls ? ' ' + cls : '') + '"><label>' + label + '</label><input name="' + name + '" placeholder="' + ph + '" value="' + esc(dv(name, val)) + '" autocomplete="off"' + (extra || '') + '></div>';
  };
  var curPhoto = photo !== undefined ? photo : (edit ? p.photo : '');
  var vtCur = dv('pvt', '');
  var d = document.createElement('dialog');
  d.className = 'md';
  d.innerHTML = '<form method="dialog" novalidate><h3>' + (edit ? 'Редактировать товар' : 'Новый товар') + '</h3><div class="fg">' +
    inp('pname', 'Название *', 'Введите название', edit ? p.name : (pre || ''), '', 'sp') +
    inp('psku', 'Артикул (необязательно)', 'Введите артикул', edit ? p.sku : '') +
    (edit ? '<div class="fd"></div>' : inp('pmin', 'Минимальный остаток (необязательно)', 'Введите число', '', ' type="number" step="1" inputmode="numeric"')) +
    sel('pcat', 'Категория *', dn('category', edit ? p.category : ''), edit ? p.category : '') +
    sel('pmat', 'Материал *', dn('material', edit ? p.material : ''), edit ? p.material : '') +
    (hasVars ? '' : '<div class="fd"><label>Тип вариации</label><select name="pvt"><option value="">Без вариации</option>' +
      opts(dn('vartype').map(function (x) { return [x, x]; }), vtCur) + '</select></div>' +
      '<div class="fd" id="pvbox"' + (vtCur ? '' : ' hidden') + '><label>Значения вариаций *</label><input name="pvals" placeholder="Например: 16, 17, 18" value="' + esc(dv('pvals', '')) + '" autocomplete="off"></div>' +
      (edit ? '<p class="mu sp" style="margin:-2px 0 10px">Чтобы разбить товар на вариации, выберите тип и укажите значения. Остаток товара при этом должен быть 0.</p>' : '')) +
    (edit ? '<div class="fd sp"><label>Фото</label><div class="rw" style="justify-content:flex-start;gap:12px;margin:0 0 10px"><div class="pc-photo" id="pph">' +
      (curPhoto ? '<img src="' + esc(curPhoto) + '" alt="">' : ico('photo')) + '</div><div><button type="button" class="ghost" data-pick>Выбрать фото</button> ' +
      '<button type="button" class="ghost dg" data-nop>Удалить фото</button></div></div><input type="file" accept="image/*" id="pfile" hidden></div>' : '') +
    '</div><p class="er">' + esc(draft && draft.err || '') + '</p><div class="rw"><button type="button" class="ghost" data-c>Отмена</button><button type="submit" class="pri">' + (edit ? 'Сохранить' : 'Создать') + '</button></div></form>';
  var f = d.querySelector('form'), er = d.querySelector('.er');
  d.querySelector('[data-c]').onclick = function () { d.close(); };
  f.addEventListener('input', function (e) { e.target.classList.remove('bad'); });
  f.addEventListener('change', function (e) { e.target.classList.remove('bad'); });
  var saving = false;
  d.addEventListener('cancel', function (e) { if (saving) e.preventDefault(); });
  var vt = f.elements.pvt;
  if (vt) vt.addEventListener('change', function () { d.querySelector('#pvbox').hidden = !vt.value; });
  if (edit) {
    var fi = d.querySelector('#pfile'), ph = d.querySelector('#pph');
    d.querySelector('[data-pick]').onclick = function () { fi.click(); };
    d.querySelector('[data-nop]').onclick = function () { photo = ''; ph.innerHTML = ico('photo'); };
    fi.onchange = function () {
      var file = fi.files && fi.files[0];
      if (!file) return;
      shrink(file, function (s) {
        if (!s) { er.textContent = 'Не удалось обработать фото. Выберите другой файл.'; return; }
        er.textContent = ''; photo = s; ph.innerHTML = '<img src="' + s + '" alt="">';
      });
      fi.value = '';
    };
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (saving) return;
    var g = function (n) { return f.elements[n] ? f.elements[n].value.trim() : ''; };
    var req = ['pname', 'pcat', 'pmat'];
    if (vt && g('pvt')) req.push('pvals');
    var bad = req.filter(function (n) { return g(n) === ''; });
    if (bad.length) {
      bad.forEach(function (n) { f.elements[n].classList.add('bad'); });
      f.elements[bad[0]].focus(); er.textContent = 'Заполните выделенные поля'; return;
    }
    var data = {name: g('pname'), sku: g('psku'), category: g('pcat'), material: g('pmat')};
    if (edit) data.id = p.id; else data.min = g('pmin');
    if (edit && photo !== undefined) data.photo = photo;
    if (vt) { data.vartype = g('pvt'); data.values = g('pvals'); }
    var snap = {f: {}, photo: photo};
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name) snap.f[el.name] = el.value; });
    // окно остается открытым, пока идет сохранение, и закрывается после ответа; при ошибке откроется заново с введенными данными
    var sb = f.querySelector('button[type="submit"]'), cb = f.querySelector('[data-c]');
    saving = true; sb.disabled = true; cb.disabled = true; S.btn = sb; er.textContent = '';
    call('products.save', data).then(function (j) {
      d.close(); done(j); toast(edit ? 'Товар сохранен' : 'Товар создан');
    }, function (err) {
      d.close(); snap.err = err.message; prodForm(edit ? (prod(p.id) || p) : null, done, pre, snap);
    });
  });
  d.addEventListener('close', function () { d.remove(); });
  openD(d);
}

      payload = {type: T, comment: D.cm, lines: D.plines.map(function (l) { return {productId: l.pid, price: l.price}; })};
    } else {
      if (T === 'receipt' && !D.sup) bad.push('sup');
      if (T === 'writeoff' && !D.rs) bad.push('rs');
      if (T === 'adjust' && !D.cm.trim()) bad.push('cm');
      if (bad.length) {
        bad.forEach(function (k) { var el = dlg().querySelector('[data-h="' + k + '"]'); if (el) el.classList.add('bad'); });
        er.textContent = 'Заполните выделенные поля'; return;
      }
      if (D.pid && D.qty !== '') { er.textContent = 'Товар выбран, но не добавлен в список. Нажмите «Добавить».'; return; }
      if (!D.lines.length) { er.textContent = 'Добавьте хотя бы одну позицию в список'; return; }
      payload = {type: T, supplier: D.sup, reason: D.rs, comment: D.cm,
        lines: D.lines.map(function (l) { return {varId: l.vid, qty: l.qty, price: l.price}; })};
    }
    // окно остается открытым, пока идет проведение, и закрывается после ответа; при ошибке документ откроется заново как был
    var snap = D, el = dlg(), sb = S.btn;
    snap.saving = true;
    if (!sb || !el.contains(sb)) sb = el.querySelector('[data-a="dSave"]');
    el.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    S.btn = sb;
    call('docs.save', payload).then(function (j) {
      D = null; el.close();
      S.docs = j.items; S.products = j.products; S.dict = j.dict; S.df = T; toast('Документ проведен'); render();
    }, function (e) {
      el.dataset.keep = '1'; el.close(); el.remove();
      snap.saving = false; snap.err = e.message; D = snap; docDlg();
    });
  },
  openDoc: function (d) {
    var doc = S.docs.filter(function (x) { return x.id === d.id; })[0];
    if (!doc) return;
    S.btn = null;
    var el = view(DOC[doc.type] + ' №' + doc.num, docHtml(doc, S.dl[d.id]));
    if (S.dl[d.id]) return;
    docLines(d.id, true).then(function (ls) {
      var vb = el.querySelector('.vb'); if (vb) vb.innerHTML = docHtml(doc, ls);
    }).catch(function (e) { el.close(); toast(e.message); });
  },
  dt: function (d) { S.dt = d.k; render(); },
  addDict: function () {
    ask('Добавить: ' + DT[S.dt], [{l: 'Название'}], 'Добавить', function (v) {
      return call('dict.add', {type: S.dt, name: v[0]}).then(dictDone);
    });
  },
  renDict: function (d) {
    var x = ditem(d.id);
    ask('Переименовать', [{l: 'Название', v: x.name}], 'Сохранить', function (v) {
      return call('dict.rename', {id: x.id, name: v[0]}).then(dictDone);
    });
  },
  arcDict: function (d) { call('dict.archive', {id: d.id}).then(dictDone).catch(function (e) { toast(e.message); }); },
  resDict: function (d) { call('dict.restore', {id: d.id}).then(dictDone).catch(function (e) { toast(e.message); }); },
  delDict: function (d) {
    var x = ditem(d.id);
    confirmDel('Запись «' + esc(x.name) + '» будет удалена. Это действие нельзя отменить.', function () {
      return call('dict.delete', {id: x.id}).then(dictDone);
    });
  },
  theme: function () {
    S.btn = null;
    var t = themeNow() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (e) {}
    document.querySelectorAll('[data-a="theme"]').forEach(function (b) { b.innerHTML = ico(t === 'dark' ? 'sun' : 'moon'); });
  },
  copyApi: function () { copy(url(), 'Ссылка скопирована'); },
  copyInfo: function () { copy(diag(), 'Диагностика скопирована'); }
};

document.addEventListener('click', function (e) {
  document.querySelectorAll('details.menu[open]').forEach(function (m) { if (!m.contains(e.target)) m.open = false; });
  if (S.more && !e.target.closest('.more') && !e.target.closest('[data-a="more"]')) { S.more = false; render(); }
  if (D && D.rcOpen && !e.target.closest('.rcbox')) { D.rcOpen = false; var pr = document.getElementById('prc'); if (pr) pr.innerHTML = ''; }
  var b = e.target.closest('[data-a]');
  if (b && A[b.dataset.a]) {
    var mm = b.closest('details.menu');
    if (mm) mm.open = false;
    S.btn = b; A[b.dataset.a](b.dataset);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && /^(pw|lg|nm|api)$/.test(e.target.id)) {
    var b = document.querySelector('.pri[data-a]'); if (b) b.click();
  }
});

document.addEventListener('change', function (e) {
  if (e.target.id !== 'srt' && e.target.id !== 'srt2') return;
  S.sort = e.target.value; localStorage.setItem('sort', S.sort);
  if (e.target.id === 'srt2') { render(); if (S.fd) S.fd.paint(); } else { document.getElementById('plist').innerHTML = plist(); syncReset(); }
});
document.addEventListener('input', dSync);
document.addEventListener('change', dSync);
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; document.getElementById('plist').innerHTML = plist(); }
});

init();
</script>
</body>
